<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הכנה למבחן באזרחות – יב׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a pastel study notebook. Each topic owns a soft color; highlighter marks carry the key words; one calm reading column, rounded paper cards. Single light theme by choice. */
:root{
  --bg:#fbfaff;
  --paper:#ffffff;
  --ink:#2c2940;
  --muted:#807b98;
  --line:#ece9f6;
  --accent:#7357e0;
  --head:"Fredoka","Rubik",system-ui,sans-serif;
  --body:"Rubik","Segoe UI",Arial,sans-serif;
  --good:#2f9468;--good-bg:#e3f6ec;--bad:#d2546a;--bad-bg:#fde8ec;
  --u1:#ece5ff;--u1d:#6a4fd6;--u2:#dff0ff;--u2d:#2c78bd;--u3:#ffe9dc;--u3d:#c9653a;
  --u4:#ffe3ec;--u4d:#c2457a;--u5:#ddf5ea;--u5d:#2b8f63;--u6:#fff3c9;--u6d:#a87c06;
  --c:var(--u1);--cd:var(--u1d);
  color-scheme:light;
}
[data-u="u1"]{--c:var(--u1);--cd:var(--u1d)}[data-u="u2"]{--c:var(--u2);--cd:var(--u2d)}[data-u="u3"]{--c:var(--u3);--cd:var(--u3d)}
[data-u="u4"]{--c:var(--u4);--cd:var(--u4d)}[data-u="u5"]{--c:var(--u5);--cd:var(--u5d)}[data-u="u6"]{--c:var(--u6);--cd:var(--u6d)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);font-weight:600;margin:0;line-height:1.25;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:var(--cd)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:8px}
mark{background:linear-gradient(transparent 52%,var(--c) 52%);color:inherit;padding:0 2px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
aside{position:sticky;top:0;height:100vh;overflow-y:auto;padding:30px 18px;background:linear-gradient(180deg,#f4f0ff 0%,#fbfaff 60%)}
.brand{padding:0 10px 18px}
.brand small{color:var(--muted);font-size:13px}
.brand h1{font-size:25px;color:var(--ink)}
.navG{margin-bottom:16px}
.navG h5{margin:0 0 4px;padding:0 10px;font:500 12px var(--body);color:var(--muted);letter-spacing:.03em}
.navG a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.4}
.navG a:hover{background:#fff}
.navG a[aria-current="page"]{background:#fff;box-shadow:0 2px 10px rgba(90,70,170,.08);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c);box-shadow:inset 0 0 0 1.5px var(--cd)}
.navG a .pct{margin-inline-start:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

main{padding:44px 40px 90px}
.col{max-width:780px;margin:0 auto}

/* hero */
.hero{background:var(--c);border-radius:28px;padding:34px 36px 30px;position:relative;overflow:hidden;margin-bottom:26px}
.hero::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.45);inset-inline-start:-60px;top:-80px}
.hero>*{position:relative;z-index:1}
.hero .eye{font-size:13.5px;color:var(--cd);font-weight:500}
.hero h1{font-size:clamp(30px,4.6vw,42px);margin:4px 0 8px}
.hero p{margin:0;max-width:58ch;color:#4b4763}

.card{background:var(--paper);border-radius:22px;padding:24px 26px;box-shadow:0 2px 14px rgba(90,70,170,.06);margin-bottom:18px}
.card h3{font-size:20px;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* tabs */
.tabs{display:flex;gap:6px;background:var(--paper);padding:6px;border-radius:16px;box-shadow:0 2px 14px rgba(90,70,170,.06);margin-bottom:22px;position:sticky;top:10px;z-index:4;overflow-x:auto}
.tab{padding:8px 16px;border-radius:11px;font-weight:500;font-size:15px;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);color:var(--cd);font-weight:600}

/* explain */
.question{font-family:var(--head);font-size:22px;color:var(--cd);margin:0 0 14px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.chain span{background:var(--c);color:var(--cd);padding:3px 12px;border-radius:99px;font-size:13.5px;font-weight:500}
.chain i{color:var(--muted);font-style:normal;font-size:13px}
.prose h4{font-size:18px;margin:26px 0 6px;color:var(--ink)}
.prose p{margin:0 0 12px}
.prose ul,.prose ol{margin:0 0 12px;padding-inline-start:22px}
.prose li{margin:4px 0}
.prose .ex{background:var(--bg);border-radius:14px;padding:12px 16px;font-size:15.5px;border-inline-start:4px solid var(--c)}
.prose ol.tree{list-style:none;padding:0;counter-reset:t}
.prose ol.tree li{counter-increment:t;padding-inline-start:34px;position:relative;margin:8px 0}
.prose ol.tree li::before{content:counter(t);position:absolute;inset-inline-start:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--cd);font:600 13px var(--head);display:grid;place-items:center}
.tips{background:var(--c);border-radius:22px;padding:20px 24px;margin-top:20px}
.tips h4{font-size:17px;color:var(--cd);margin-bottom:6px}
.tips ul{margin:0;padding-inline-start:20px}
.tips li{margin:6px 0;font-size:15.5px}

/* terms */
.term{background:var(--paper);border-radius:20px;padding:20px 22px;box-shadow:0 2px 14px rgba(90,70,170,.05);margin-bottom:12px}
.term .th{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.term h3{font-size:19px}
.badge{font-size:12.5px;font-weight:500;color:var(--cd);background:var(--c);padding:1px 10px;border-radius:99px;white-space:nowrap}
.comps{list-style:none;margin:10px 0 0;padding:0;counter-reset:c}
.comps li{counter-increment:c;padding-inline-start:32px;position:relative;margin:6px 0}
.comps li::before{content:counter(c);position:absolute;inset-inline-start:0;top:3px;width:22px;height:22px;border-radius:8px;background:var(--c);color:var(--cd);font:600 12.5px var(--head);display:grid;place-items:center}
.hideC .comps li span{filter:blur(5px);cursor:pointer;transition:filter .15s}
.hideC .comps li.peek span{filter:none}
.meta{font-size:14.5px;color:var(--muted);margin:10px 0 0}
.meta b{color:var(--ink);font-weight:500}
.meta.trap{color:#7d5160}.meta.trap b{color:var(--bad)}
.switch{display:inline-flex;gap:10px;align-items:center;font-size:14.5px;color:var(--muted);cursor:pointer;margin-bottom:14px}
.switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:inset-inline-start .2s}
.switch input:checked{background:var(--cd)}
.switch input:checked::after{inset-inline-start:19px}

/* tables & pairs */
.tblWrap{overflow-x:auto;background:var(--paper);border-radius:20px;box-shadow:0 2px 14px rgba(90,70,170,.05);margin:10px 0 22px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:start;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
thead th{background:var(--c);color:var(--cd);font:600 14.5px var(--head)}
tbody tr:last-child>*{border-bottom:0}
tbody th{font-weight:600;white-space:nowrap}
.sub-h{font-size:18px;margin:8px 0 0}
.pair{background:var(--paper);border-radius:20px;padding:18px 22px;box-shadow:0 2px 14px rgba(90,70,170,.05);margin-bottom:12px}
.pair .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.pair h4{font-size:16.5px}
.pair p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.pair .how{margin-top:12px;background:var(--c);border-radius:12px;padding:9px 14px;font-size:15px}
.pair .how b{color:var(--cd);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:14px;font-weight:500;font-size:15px;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);transition:box-shadow .15s,transform .1s}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--ink);color:#fff;box-shadow:none}
.btn.main:hover{background:#45405f}
.btn.soft{background:var(--c);color:var(--cd);box-shadow:none;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{color:var(--cd);font-weight:500;font-size:15px}
.lnk:hover{text-decoration:underline}

/* home */
.path{display:grid;gap:10px;margin:6px 0 0}
.stage{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:14px 0;border-bottom:1px dashed var(--line)}
.stage:last-child{border-bottom:0}
.stage .num{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:600 20px var(--head)}
.stage h4{font-size:17px}
.stage p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.stage .go{font-size:14px}
.mastery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mcard{background:var(--c);border-radius:20px;padding:16px 18px;text-decoration:none;color:var(--ink);display:grid;gap:8px}
.mcard b{font:600 16px var(--head)}
.mcard .bar{height:7px;background:rgba(255,255,255,.75);border-radius:99px;overflow:hidden}
.mcard .bar i{display:block;height:100%;background:var(--cd);border-radius:99px}
.mcard small{color:var(--cd);font-size:13px;font-variant-numeric:tabular-nums}
.plan{list-style:none;margin:12px 0 0;padding:0}
.plan li{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.plan li:last-child{border-bottom:0}
.plan li .d{font:600 14px var(--head);color:var(--accent);font-variant-numeric:tabular-nums}
.plan li.today .d::after{content:" · היום";color:var(--bad)}
input[type=date]{font:inherit;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--ink)}

/* practice shells */
.stage-card{background:var(--paper);border-radius:26px;padding:28px 30px;box-shadow:0 4px 22px rgba(90,70,170,.08)}
.topline{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted);margin-bottom:18px;font-variant-numeric:tabular-nums}
.topline .bar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.topline .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--c);color:var(--cd);font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:99px}
.big{font-family:var(--head);font-size:clamp(24px,3.6vw,32px);margin:10px 0 4px}
.scen{font-size:18.5px;line-height:1.75;margin:10px 0 4px}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{text-align:start;padding:13px 18px;border-radius:14px;background:var(--bg);font-weight:500;transition:background .15s,box-shadow .15s;box-shadow:inset 0 0 0 1.5px transparent}
.opt:hover{box-shadow:inset 0 0 0 1.5px var(--line)}
.opt.ok{background:var(--good-bg);color:var(--good);box-shadow:inset 0 0 0 1.5px var(--good)}
.opt.no{background:var(--bad-bg);color:var(--bad)}
.opt .why{display:block;font-size:13.5px;font-weight:400;color:var(--muted);margin-top:2px}
.fb{margin-top:16px;font-size:15.5px}
.fb b{font-family:var(--head);font-weight:600}
textarea{width:100%;min-height:110px;margin-top:10px;font:inherit;font-size:15.5px;line-height:1.7;padding:12px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);resize:vertical}
textarea:focus{outline:none;border-color:var(--accent);background:#fff}
.checklist{display:grid;gap:6px;margin-top:12px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:9px 14px;border-radius:12px;background:var(--bg);cursor:pointer;font-size:15px}
.checklist input{accent-color:var(--accent);width:18px;height:18px;margin-top:4px;flex:none}
.flip{background:var(--c);border-radius:20px;padding:18px 22px;margin-top:16px}
.passage{background:var(--bg);border-radius:18px;padding:16px 20px;font-size:16px;line-height:1.85}
.passage .s{border-radius:6px;cursor:pointer;transition:background .12s;padding:1px 0}
.passage.pick .s:hover{background:var(--c)}
.passage .s.ok{background:var(--good-bg);box-shadow:0 0 0 2px var(--good-bg)}
.passage .s.no{background:var(--bad-bg);text-decoration:line-through;text-decoration-color:var(--bad)}
.handwrite{background:#fffdf3;border-radius:18px;padding:16px 20px;box-shadow:inset 0 0 0 1.5px #f1e7bf;font-size:15.5px;background-image:repeating-linear-gradient(transparent 0 27px,#f3ecd0 27px 28px);line-height:28px}
.model dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
.model dt{font:600 15px var(--head);color:var(--good)}
.model dd{margin:0}
.model{background:var(--good-bg);border-radius:18px;padding:16px 20px;font-size:15.5px}

/* lists of questions */
.q{background:var(--paper);border-radius:24px;padding:24px 26px;box-shadow:0 2px 14px rgba(90,70,170,.05);margin-bottom:16px}
.q .qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:12px}
.q .qh h3{font-size:19px}
.sq{margin-top:16px}
.sq .qq{font-weight:500}
.ans{display:none;margin-top:10px}
.ans.show{display:block}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filters button{padding:6px 14px;border-radius:99px;background:var(--paper);font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}

.timer{font:700 42px var(--head);font-variant-numeric:tabular-nums;color:var(--accent);line-height:1}
.simbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:10px;z-index:4}

/* cheat */
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.cheat section{border-radius:20px;padding:18px 20px;background:var(--c)}
.cheat h4{font-size:16px;color:var(--cd);margin-bottom:4px}
.cheat .mn{font:700 22px var(--head);color:var(--cd);letter-spacing:.04em}
.cheat ul{margin:4px 0 0;padding-inline-start:18px;font-size:14.5px}
.cheat li{margin:3px 0}

.pager{display:flex;justify-content:space-between;margin-top:40px;gap:10px}
.pager a{text-decoration:none;background:var(--paper);border-radius:16px;padding:12px 18px;box-shadow:0 2px 14px rgba(90,70,170,.05);color:var(--ink);font-size:15px}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager .nx{margin-inline-start:auto;text-align:end}


/* figures */
.meme{margin:20px 0 0}.meme svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 14px rgba(90,70,170,.10))}
.fig{margin:18px 0 20px;text-align:center}
.fig img{max-width:100%;max-height:280px;border-radius:18px;display:inline-block}
.fig svg{width:100%;height:auto;max-width:700px;display:block;margin:0 auto}
.fig.svgf{background:var(--bg);border-radius:20px;padding:16px 12px 8px}
.fig figcaption{font-size:13.5px;color:var(--muted);margin-top:6px}
.fig2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 20px}
.fig2 .fig{margin:0}
.fig2 img{height:220px;width:100%;object-fit:contain;background:#fff}
.fig.wide img{max-height:none;width:100%;box-shadow:0 2px 14px rgba(90,70,170,.08)}
.fig img{background:#fff}
.hero.img{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px;align-items:center}
.hero .hi{width:190px;height:150px;object-fit:contain;border-radius:18px;background:rgba(255,255,255,.55);padding:6px}
@media (max-width:640px){.hero.img{grid-template-columns:1fr}.hero .hi{display:none}.fig2{grid-template-columns:1fr}}

@media (max-width:920px){
  .app{grid-template-columns:1fr}
  aside{position:sticky;top:0;z-index:10;height:auto;padding:10px 12px;display:flex;overflow-x:auto;background:#f4f0ff;box-shadow:0 2px 12px rgba(90,70,170,.08)}
  .brand{display:none}
  #nav{display:flex;gap:2px}
  .navG{display:flex;margin:0;gap:2px}
  .navG h5,.navG .pct{display:none}
  .navG a{white-space:nowrap}
  main{padding:24px 16px 70px}
  .hero{padding:26px 22px;border-radius:22px}
  .stage-card,.q,.card{padding:20px}
  .pair .two{grid-template-columns:1fr;gap:10px}
  .tabs{top:60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside><div class="brand"><small>אזרחות · שכבת יב׳</small><h1>הכנה למבחן</h1></div><nav id="nav" aria-label="ניווט"></nav></aside>
  <main><div class="col" id="view"></div></main>
</div>
<script>
const UNITS = [
 {id:"u1", title:"הרעיון הדמוקרטי", pages:"עמ׳ 155–163", defs:[
  {t:"מצב הטבע", c:["מצב (היפותטי) של בני אדם לפני קיום מדינה ושלטון","אין חוקים, אין שלטון ואין סדר","כל אדם חופשי לגמרי ופועל לפי רצונו ולטובת עצמו"], trap:"הובס ולוק מתארים את מצב הטבע אחרת. אם השאלה שואלת ״לפי הובס״ או ״לפי לוק״, חובה לציין את ההבדל בטבע האדם.", cue:"״אין משטרה ואין חוק״, ״כל אחד לעצמו״, אנרכיה, אי בודד"},
  {t:"מצב הטבע לפי הובס", c:["האדם רע מיסודו, יצרי (״אדם לאדם זאב״)","מצב הטבע הוא מלחמת כולם בכולם ופחד תמידי","בני האדם מוותרים על חירותם לטובת שלטון חזק שיגן עליהם; ביטחון קודם לחירות"], cue:"פחד, אלימות, ״עדיף שלטון חזק על כאוס״"},
  {t:"מצב הטבע לפי לוק", c:["האדם טוב ותבוני מיסודו","במצב הטבע בני האדם חופשיים ושווים וחיים בשלום, עד שמעטים אלימים מסכנים אותו","מקימים שלטון כדי להגן על הזכויות הטבעיות (חיים, חירות, קניין); שלטון שמפר אותן מאבד את הלגיטימציה"], cue:"שלטון שנועד לשמור על זכויות; ״העם רשאי להחליף שלטון שפוגע בו״"},
  {t:"האמנה החברתית", c:["הסכם (מעין חוזה) בין בני אדם, בינם לבין עצמם ובינם לבין השלטון","הם מוותרים על חלק מחירותם הטבעית","בתמורה זוכים לביטחון ולהגנה על זכויותיהם"], trap:"האמנה גם מצדיקה את כוח השלטון וגם מגבילה אותו: הסמכות נובעת מהסכמת העם. זה הבסיס הרעיוני לשלטון העם.", cue:"ויתור הדדי, ״אני מוותר על... ובתמורה...״, כללים משותפים בחיי היום-יום"},

 {id:"u3", title:"עקרון הכרעת הרוב", pages:"עמ׳ 189–192", defs:[
  {t:"עקרון הכרעת הרוב", c:["מתוך כמה אפשרויות נבחרת / מתקבלת זו שרוב האוכלוסייה / רוב הנציגים / רוב המצביעים תומכים בה","אסור לרוב לקבל החלטות שפוגעות באופן לא סביר / בלתי מוצדק בזכויות יסוד, ובמיוחד בזכויות המיעוט"], trap:"שני הרכיבים חובה. מי שכותב רק ״מה שהרוב רוצה״ מקבל חצי.", cue:"הצבעה בכנסת, בממשלה, בהרכב שופטים, בבחירות; ״הרוב החליט״"},
  {t:"עריצות הרוב", c:["שימוש לרעה בעקרון הכרעת הרוב","הרוב מנצל את כוחו ופוגע באופן לא מידתי בזכויות המיעוט / בזכויות יסוד / בעקרונות הדמוקרטיה"], trap:"החלטה ברוב קולות שמבטלת בחירות, אוסרת על המיעוט להתארגן או להביע דעה = עריצות, גם אם התקבלה לפי הנהלים.", cue:"״הרוב החליט לאסור על...״ קבוצה מסוימת"},
  {t:"למה העיקרון חיוני ולמה הוא מסוכן", c:["חיוני: מאפשר הכרעה לפי כללים מוסכמים בלי אלימות; מבטא את שלטון העם ואת השוויון (כל קול שווה)","מסוכן: הרוב עלול לנצל כוחו, והרוב עלול להיות קבוע; נדרשת פרשנות מה מידתי","הכרעה לפי הנהלים = מובן פורמלי. הגבלת הרוב ומניעת עריצות = מובן מהותי"]},
  {t:"סוגי רוב (מושג רקע)", c:["רוב רגיל: מספר הקולות הגדול ביותר מבין המשתתפים בהצבעה","רוב מוחלט: יותר ממחצית בעלי זכות ההצבעה או המשתתפים (בכנסת: 61)","רוב מיוחס/מיוחד: אחוז או מספר שנקבע מראש, גדול מרוב מוחלט (למשל 80 ח״כים)"]}
 ]},
 {id:"u4", title:"זכויות אדם וזכויות פוליטיות", pages:"עמ׳ 206–254", defs:[

  {t:"הזכות לחירות", c:["היבט חיובי (חירות ל-): לכל אדם זכות לחיות, להחליט ולפעול לפי רצונו החופשי","היבט שלילי (חירות מ-): אין לשלול את חירותו במעצר או בהגבלת חופש המחשבה והפעולה","ממנה נגזרות שורה של חירויות: ביטוי, מחשבה ומצפון, תנועה, עיסוק, דת, מדת ועוד"], trap:"במבחן עדיף לציין את החירות הספציפית (״חופש התנועה״) ולא ״הזכות לחירות״ הכללית.", cue:"מעצר שרירותי, הגבלה, ״לחיות כרצוני״"},
  {t:"חופש הביטוי", c:["לכל אדם זכות לבטא ולהפיץ את עמדותיו, דעותיו ואמונותיו","בכל דרך (לבוש, פולחן, תקשורת, אמנות, דיבור, כתב) ובפומבי"], cue:"פוסט, הצגה, קריקטורה, כתבה, שלט"},
  {t:"חופש המחשבה והמצפון", c:["לכל אדם זכות להחזיק בכל דעה ומחשבה לפי בחירתו","לכל אדם זכות לפעול לפי מצפונו / לא לפעול בניגוד למצפונו"], cue:"סרבנות מצפון, ״אני לא מוכן לעשות את זה כי זה נוגד את ערכיי״"},
  {t:"חופש התנועה", c:["לכל אדם זכות לנוע כרצונו ולהימצא בכל מקום","(זכות הכניסה החופשית למדינה מוקנית לאזרחים בלבד)"], cue:"מחסום, שער נעול, איסור יציאה מהארץ, חסימת גישה לחוף"},
  {t:"חופש העיסוק", c:["לכל אדם זכות לעבוד בכל עבודה, מקצוע ומשלח יד","כפוף להכשרה ורישוי נדרשים (בישראל: לאזרחים ולתושבים)"], cue:"רישיון, פתיחת עסק, מניעת עבודה במקצוע"},
  {t:"חופש הדת", c:["לכל אדם זכות להחזיק בכל אמונה ולהשתייך לכל קבוצה דתית","לקיים כל טקס, מנהג או פולחן"], cue:"תפילה, כיסוי ראש, בניית מקום פולחן"},
  {t:"חופש מדת", c:["לכל אדם זכות שלא להחזיק באמונה ושלא להשתייך לקבוצה דתית","לא לסבול מכפייה או הטפה דתית, לא לקיים טקס בניגוד לרצונו"], trap:"מי שרוצה לקיים מצווה = חופש דת. מי שכופים עליו מצווה = חופש מדת.", cue:"כפייה דתית, תחבורה בשבת, ״נאלצתי להשתתף בטקס״"},
  {t:"הזכות לשוויון", c:["אין להפלות אדם בשל זהותו, שיוכו, סממן חיצוני או מגבלה (דת, גזע, מין, נטייה מינית, מוצא, מראה, מוגבלות)","אלא אם השונות רלוונטית לנושא (הבחנה מותרת)","מובן מצומצם: שוויון בפני החוק ושוויון פוליטי. מובן רחב: שוויון הזדמנויות כלכלי-חברתי"], cue:"״לא קיבלו אותי כי...״ + מאפיין זהות"},
  {t:"אפליה פסולה", c:["פגיעה בזכות לשוויון על ידי מתן יחס שונה לבני אדם","ללא סיבה מוצדקת, ובפרט בשל זהות, שיוך, סממן חיצוני או מגבלה"], cue:"יחס שונה + סיבה לא רלוונטית"},
  {t:"הבחנה מותרת", c:["מתן יחס שונה לבני אדם","כאשר השונות רלוונטית לנושא הנידון (יחס לפי צרכים)"], trap:"הבחנה אינה זמנית ואינה מתקנת עוול היסטורי. הארכת זמן בבגרות לבעלי לקות למידה = הבחנה, לא העדפה.", cue:"התאמות, נגישות, תנאי קבלה רלוונטיים, גיל לרישיון"},
  {t:"העדפה מתקנת", c:["מתן הטבה / העדפה לקבוצה או אוכלוסייה מקופחת, מופלית או חלשה","למשך זמן מסוים","במטרה לצמצם פערים / אי-שוויון"], trap:"שלושה רכיבים, וכל אחד שווה ניקוד. ״לזמן מסוים״ נשכח הכי הרבה. יש ויכוח ציבורי כי היא יוצרת אפליה כלפי פרטים אחרים.", cue:"מכסות, ייצוג הולם, מלגות לפריפריה, ״עד שהפער ייסגר״"},
  {t:"הזכות לחיים ולביטחון", c:["אין לפגוע בחייו ובגופו של אדם / לכל אדם זכות לחיים ולביטחון אישי","חובת המדינה להגן על כל מי שחי בשטחה מפני פגיעה בחייו ובגופו בידי אחרים"], cue:"סכנה בטיחותית, אלימות, מיגון, ״עלול לסכן את הנוסעים״"},

 {id:"e3",unit:"u4",src:true,title:"זיהום באזור התעשייה",text:"תושבים המתגוררים בסמוך לאזור תעשייה גילו כי המפעלים המקומיים פולטים חומרים מזהמים המסכנים את בריאות הציבור. התושבים פנו לרשות המקומית ולמשרד להגנת הסביבה בדרישה לקבל את תוצאות בדיקות זיהום האוויר והשפכים שנערכו באזור בשנים האחרונות. משלא נענו, פתחו התושבים במחאה ציבורית וארגנו תהלוכה מול בניין העירייה כדי לעורר הד ציבורי וללחוץ על הנהלת העירייה לפרסם את הנתונים.",subs:[

 {id:"e4",unit:"u6",src:true,title:"חוק השפה באירופה",text:"במדינה מסוימת באירופה נחקק חוק חדש האוסר על הפעלת בתי ספר פרטיים או אוטונומיים המלמדים בשפות שאינן שפת המדינה הרשמית, ומחייב את כל מוסדות החינוך ללמד אך ורק לפי תוכנית הלימודים הממשלתית האחידה. מטרת החוק, לפי דברי ההסבר, היא להביא להטמעה מלאה של בני קבוצות המיעוט בתרבות השלטת ולמנוע פיצול חברתי.",subs:[

 {id:"e5",unit:"u6",src:true,title:"תוכניות לימוד ומפלגה חדשה",text:"קבוצת אזרחים מהמיעוט הערבי בישראל פנתה למשרד החינוך בדרישה להגדיל את התקציבים המיועדים לפיתוח תוכניות לימוד ייחודיות בהיסטוריה ובתרבות ערבית בבתי הספר של המגזר הערבי, כדי לשמור על הזהות התרבותית והלשונית של התלמידים. במקביל הקימו חברי הקבוצה מפלגה פוליטית חדשה במטרה להתמודד בבחירות הבאות לכנסת ולקדם חקיקה בנושא.",subs:[

  {q:"ב. ציין והסבר איזו זכות פוליטית של אזרחים מומשה בהקמת המפלגה. הסבר.",a:{s:"הזכות להתאגדות פוליטית (להקים מפלגה ולהיות חבר בה).",p:"זכות פוליטית של אזרחים בלבד: להתחבר לקבוצה במסגרת מפלגה ובאמצעותה להשפיע על החיים הציבוריים ולהביא לשינויים חברתיים ופוליטיים.",q:"״הקימו חברי הקבוצה מפלגה פוליטית חדשה במטרה להתמודד בבחירות הבאות לכנסת ולקדם חקיקה בנושא״.",l:"כלומר, האזרחים התארגנו במפלגה כדי להיבחר לכנסת ולהשפיע מתוכה על החקיקה. זו זכות שמוקנית רק לאזרחי המדינה."}}]},
 {id:"e6",unit:"u4",src:true,title:"עישון במפעל",text:"בעל מפעל פרטי למוצרי אלקטרוניקה הודיע לעובדיו שהחליט לאסור את העישון בזמן העבודה. הוא הסביר שבתהליך הייצור נדרשת השגחה צמודה ורציפה של העובדים על המכונות במפעל. לטענתו, יציאת העובדים להפסקות עישון תכופות, בזמן שהם צריכים להשגיח על המכונות, גורמת לתקלות במכונות ולמוצרים פגומים. בעל המפעל הוסיף שכדי להבטיח שעובדים לא יעשנו, תיאסר הכנסת סיגריות לתחום המפעל, וייערכו חיפושים בתיקי העובדים ובבגדיהם. ארבעה עובדים אמרו שאינם מוכנים שיחפשו אצלם סיגריות.",subs:[

  {q:"ציין והסבר בשם איזו זכות התנגדו ארבעת העובדים לחיפוש. נמק.",a:{s:"הזכות לכבוד (הזכות לפרטיות).",p:"הזכות שלא להיות נתון ליחס משפיל, והזכות לחיות ללא חשיפה, התערבות או חדירה לחייו, לגופו ולחפציו (פרטיות).",q:"״וייערכו חיפושים בתיקי העובדים ובבגדיהם. ארבעה עובדים אמרו שאינם מוכנים שיחפשו אצלם״.",l:"כלומר, חיפוש בתיקים ובבגדים הוא חדירה לחפציו ולגופו של העובד, ולכן העובדים טוענים שהוא פוגע בפרטיותם ובכבודם."}}]},
 {id:"e7",unit:"u4",src:true,title:"החיילת המצטיינת",text:"חיילת סיימה בהצטיינות קורס מקצועי בצה״ל. בסיום הקורס שובצו החיילות לתפקידים בהתאם לציוניהן. החיילת המצטיינת פנתה אל הממונה על השיבוצים בתלונה שלא שובצה לתפקיד שביקשה, אף שסיימה את הקורס בציונים הגבוהים ביותר. לטענתה, היא לא קיבלה את התפקיד רק משום שהיא פחות נאה מהבוגרות האחרות. הממונה השיב: התפקיד שביקשת קיים רק באזור המרכז, ואפשר לשבץ אליו רק חיילת אחת. החלטתי לשבץ חיילת מאזור המרכז, שגם היא בוגרת הקורס, משום שהצבא הכיר בזכותה לשרת קרוב לבית בגלל בעיות במשפחתה.",subs:[
  {q:"ציין והסבר איזו זכות של החיילת המצטיינת נפגעה לטענתה. נמק.",a:{s:"הזכות לשוויון.",p:"אין להפלות אדם בשל זהותו, שיוכו, סממן חיצוני או מגבלה (כמו מראה חיצוני), אלא אם השונות רלוונטית לנושא.",q:"״לטענתה, היא לא קיבלה את התפקיד רק משום שהיא פחות נאה מהבוגרות האחרות״.",l:"כלומר, לטענתה ניתן לה יחס שונה בגלל מראה חיצוני, שאינו קשור ליכולתה המקצועית, ולכן נפגעה זכותה לשוויון."}},
  {q:"ציין והסבר מהי המדיניות שעליה ביסס הממונה את החלטתו. נמק.",a:{s:"הבחנה מותרת.",p:"מתן יחס שונה לבני אדם כאשר השונות רלוונטית לנושא הנידון (יחס לפי צרכים).",q:"״החלטתי לשבץ חיילת מאזור המרכז... משום שהצבא הכיר בזכותה לשרת קרוב לבית בגלל בעיות במשפחתה״.",l:"כלומר, החיילת האחרת קיבלה יחס שונה בגלל צורך רלוונטי (בעיות משפחתיות ומגורים במרכז), ולא בגלל מראה. אין כאן קבוצה מקופחת או הגבלת זמן, ולכן זו הבחנה ולא העדפה מתקנת."}}]},
 {id:"e8",unit:"u4",src:true,title:"נחל ״האסי״",text:"״האסי״ הוא כינוי לקטע של נחל עמל, הזורם סמוך לבתי מגורים באחד הקיבוצים בצפון הארץ. בעת האחרונה התעוררה מחלוקת ציבורית בנוגע לגישה של מבקרים לקטע הנחל. שומרים מטעם הנהלת הקיבוץ עמדו בשער ומנעו ממבקרים ומתושבים של יישובים סמוכים להיכנס לקיבוץ כדי להגיע לקטע הנחל. הדבר עורר את כעסם של המבקרים, שטענו כי השומרים פוגעים באחת מזכויות היסוד שלהם. כדי לפתור מחלוקת זו יזמו ראשי היישובים פגישה עם הנהלת הקיבוץ, ובעקבותיה פרסמו הודעה שבה נאמר כי הצדדים החליטו לפעול בשיתוף מלא מתוך רצון לשמור על חיים בשכנות טובה, וכי מעתה הקיבוץ יקצה למבקרים אזור מסוים, מרוחק מבתי המגורים, שיאפשר להם לבלות בנחל בלי להפריע לתושבי הקיבוץ.",subs:[
  {q:"א. ציין והצג את הזכות של המבקרים שנפגעה לטענתם. הסבר.",a:{s:"חופש התנועה.",p:"לכל אדם זכות לנוע כרצונו ולהימצא בכל מקום.",q:"״שומרים מטעם הנהלת הקיבוץ עמדו בשער ומנעו ממבקרים... להיכנס לקיבוץ כדי להגיע לקטע הנחל״.",l:"כלומר, המבקרים טוענים שמונעים מהם להגיע למקום שבו הם רוצים להימצא, ולכן נפגע חופש התנועה שלהם."}},
  {q:"ב. ציין והצג את העיקרון הדמוקרטי שבא לידי ביטוי בהודעה המשותפת. הסבר. (הערה: נושא תרבות פוליטית, מחוץ לרשימה הרשמית, אבל בדף התרגול)",a:{s:"עקרון הסובלנות.",p:"קבלת השונה ויחס מכבד לשונים ממני; הימנעות מתגובות אלימות, מילוליות או פיזיות, בעת מחלוקת.",q:"״הצדדים החליטו לפעול בשיתוף מלא מתוך רצון לשמור על חיים בשכנות טובה... שיאפשר להם לבלות בנחל בלי להפריע לתושבי הקיבוץ״.",l:"כלומר, במקום להסלים את המחלוקת, כל צד מכבד את הצרכים של הצד השני ומוכן לוותר במידה, והמחלוקת נפתרת בדרכי שלום."}}]},
 {id:"e9",unit:"u1",title:"כנס חינוך ודמוקרטיה",text:"ארגון בין-לאומי ערך כנס בענייני חינוך ודמוקרטיה. אחד הדוברים בכנס קרא למדינות העשירות בעולם לתרום כסף למפעלים חינוכיים במדינות שהפכו לדמוקרטיות רק לאחרונה. לדבריו, זכויות האדם והאזרח אינן זוכות במדינות אלה למעמד הראוי בגלל שבעבר הן לא היו דמוקרטיות. לכן הוא מבקש שהעולם יסייע, באמצעות חינוך, להנחיל את החשיבות של שמירה על זכויות האדם.",subs:[
  {q:"ציין והצג את המובן של דמוקרטיה שבא לידי ביטוי בבקשת הדובר. הסבר.",a:{s:"דמוקרטיה מהותית.",p:"דמוקרטיה כהשקפת עולם ערכית שמעמידה את האדם במרכז ורואה בשמירת זכויות האדם ערך עליון; המיקוד הוא בתוכן ההחלטות ובשאלה אם הן מקדמות ערכים דמוקרטיים.",q:"״זכויות האדם והאזרח אינן זוכות במדינות אלה למעמד הראוי... לכן הוא מבקש שהעולם יסייע, באמצעות חינוך, להנחיל את החשיבות של שמירה על זכויות האדם״.",l:"כלומר, לדעת הדובר לא די בכך שהמדינות הפכו לדמוקרטיות במבנה השלטון; יש להנחיל בהן ערכים, ובראשם זכויות האדם, שהם הבסיס לדמוקרטיה המהותית."}}]},
 {id:"e10",unit:"u1",title:"האוהד במגרש",text:"במהלך משחק כדורגל קראו אוהדי אחת הקבוצות קריאות גזעניות כלפי אוהדי הקבוצה היריבה. אחרי המשחק אמר אחד האוהדים הנפגעים: ״בישראל חושבים שמשטר דמוקרטי זה לתת לכל האזרחים, יהודים וערבים, להצביע בבחירות, ולשמור שכולם יצייתו לחוק. אני חושב שישראל תהיה דמוקרטית רק כשכולם יפנימו שגם לערבי, כמו לכל אדם, מגיע שוויון מלא וחופש לבחור כיצד לחיות. דמוקרטיה אינה רק שלטון הרוב, אלא גם ובעיקר הגנה על כבוד האדם ועל זכויות הפרט והמיעוט.״",subs:[
  {q:"א. ציין והצג את המובן של דמוקרטיה שלדברי האוהד קיים בישראל. הסבר.",a:{s:"דמוקרטיה פורמלית.",p:"דמוקרטיה כצורת ממשל: הדגש על כללי משחק ועל אופן קבלת ההחלטות, כמו שלטון העם, בחירות, הכרעת הרוב ושלטון החוק.",q:"״בישראל חושבים שמשטר דמוקרטי זה לתת לכל האזרחים... להצביע בבחירות, ולשמור שכולם יצייתו לחוק״.",l:"כלומר, לטענתו בישראל מסתפקים בנהלים: בחירות כלליות וציות לחוק, בלי להפנים את הערכים."}},
  {q:"ב. ציין והצג את המובן שהאוהד מבקש שיתקיים. הסבר.",a:{s:"דמוקרטיה מהותית.",p:"דמוקרטיה כהשקפת עולם ערכית: האדם במרכז, זכויות האדם ערך עליון, כולל שמירה על זכויות המיעוט, סובלנות ופלורליזם.",q:"״דמוקרטיה אינה רק שלטון הרוב, אלא גם ובעיקר הגנה על כבוד האדם ועל זכויות הפרט והמיעוט״.",l:"כלומר, האוהד דורש שהדמוקרטיה תבוא לידי ביטוי גם בתוכן: יחס שווה ומכבד לערבים כבני מיעוט."}}]},
 {id:"e11",unit:"u1",title:"אי בלי חוקים",text:"בעקבות סערה נתקעו כמה עשרות נוסעים של ספינה על אי בודד. בימים הראשונים כל אחד דאג רק לעצמו: החזקים לקחו את רוב האוכל, היו קטטות על מקומות שינה, ואיש לא העז לישון בלי לשמור על חפציו. בסוף השבוע הראשון התכנסו הנוסעים והחליטו: כל אחד יוותר על הזכות לקחת אוכל כרצונו, ייבחר ״ועד״ שיחלק את המזון בשווה ויעניש מי שתוקף אחרים, ובתמורה כולם ידעו שגופם ורכושם מוגנים.",subs:[
  {q:"א. ציין והצג את המצב שתיאר את חיי הנוסעים בימים הראשונים. הסבר. (ציין גם איזה הוגה תיאר מצב כזה)",a:{s:"מצב הטבע, לפי תיאורו של תומאס הובס.",p:"מצב של בני אדם לפני קיום שלטון: אין חוקים, אין שלטון ואין סדר, וכל אדם חופשי לגמרי ופועל לטובת עצמו. לפי הובס האדם רע מיסודו ומצב הטבע הוא מלחמת כולם בכולם ופחד תמידי.",q:"״כל אחד דאג רק לעצמו: החזקים לקחו את רוב האוכל, היו קטטות... ואיש לא העז לישון בלי לשמור על חפציו״.",l:"כלומר, בהיעדר שלטון וחוקים כל אחד פועל לטובתו, החזק גובר על החלש וכולם חיים בפחד, בדיוק כפי שהובס תיאר את מצב הטבע."}},
  {q:"ב. ציין והצג את הרעיון שבא לידי ביטוי בהחלטת הנוסעים. הסבר.",a:{s:"האמנה החברתית.",p:"הסכם בין בני אדם שבו הם מוותרים על חלק מחירותם הטבעית, ובתמורה זוכים לביטחון ולהגנה על זכויותיהם; הסכם זה מצדיק את סמכות השלטון.",q:"״כל אחד יוותר על הזכות לקחת אוכל כרצונו, ייבחר ׳ועד׳... ובתמורה כולם ידעו שגופם ורכושם מוגנים״.",l:"כלומר, הנוסעים מסכימים מרצונם לוותר על חלק מהחופש שלהם ולהקים גוף שלטוני, ובתמורה מקבלים הגנה על חייהם ורכושם."}}]},
 {id:"e12",unit:"u2",title:"משאל העם על הגירה",text:"בשוויץ נערך משאל עם על הצעה להגביל את מספר המהגרים שייכנסו למדינה. 50.3% מהמצביעים תמכו בהצעה, והממשלה הודיעה שתפעל ליישם אותה. ארגוני מהגרים טענו שהשאלה נוסחה באופן מטעה, ושעניין כל כך מורכב לא היה צריך להיות מוכרע ב״כן״ או ״לא״ אלא בדיון מעמיק בפרלמנט.",subs:[
  {q:"א. ציין והצג את הכלי הדמוקרטי שבו השתמשו בשוויץ. הסבר.",a:{s:"משאל עם.",p:"שאלה מוגדרת המופנית אל כלל ציבור הבוחרים; כלי של דמוקרטיה ישירה, כדי לשקף ישירות את עמדות הציבור. בחלק מהמדינות התוצאות מחייבות ובאחרות מייעצות.",q:"״נערך משאל עם על הצעה להגביל את מספר המהגרים... 50.3% מהמצביעים תמכו בהצעה״.",l:"כלומר, ההחלטה לא התקבלה על ידי הנציגים אלא הועברה להכרעה ישירה של כלל הבוחרים, בשאלה אחת מוגדרת."}},
  {q:"ב. הצג טיעון נגד השימוש בכלי זה, כפי שבא לידי ביטוי בקטע.",a:{s:"משאל עם מצמצם סוגיה מורכבת ל״כן/לא״.",p:"לאזרחים אין תמיד זמן ומידע להעמיק בבעיות מורכבות, והניסוח עלול להטות את התוצאה. דמוקרטיה ייצוגית מאפשרת דיון מעמיק ופשרות.",q:"״עניין כל כך מורכב לא היה צריך להיות מוכרע ב׳כן׳ או ׳לא׳ אלא בדיון מעמיק בפרלמנט״.",l:"כלומר, הארגונים טוענים שמשאל עם אינו מאפשר דיון בפרטים ובחלופות, ולכן ההחלטה פחות מושכלת."}}]},
 {id:"e13",unit:"u3",title:"חוק השילוט",text:"במדינה מסוימת שבה מיעוט לאומי של כ-15%, הציעו חברי פרלמנט מקבוצת הרוב חוק שלפיו מפלגות לא יורשו לפרסם תעמולת בחירות בשפה שאינה השפה הרשמית. החוק עבר ברוב של 85 מתוך 120 חברי הפרלמנט. נציגי המיעוט טענו שהחוק נועד למנוע מהם לשכנע את בוחריהם, ועתרו לבית המשפט.",subs:[
  {q:"ציין והצג את המושג שבשמו טענו נציגי המיעוט נגד החוק. הסבר.",a:{s:"עריצות הרוב.",p:"שימוש לרעה בעקרון הכרעת הרוב: הרוב מנצל את כוחו ופוגע באופן לא מידתי בזכויות המיעוט ובאפשרותו לבטא את דעותיו ולשכנע את הציבור.",q:"״החוק עבר ברוב של 85 מתוך 120... נציגי המיעוט טענו שהחוק נועד למנוע מהם לשכנע את בוחריהם״.",l:"כלומר, אף שהחוק התקבל ברוב לפי הנהלים, הרוב משתמש בכוחו כדי לפגוע ביכולת המיעוט להשתתף בתחרות הפוליטית, ולכן זו עריצות ולא הכרעת רוב לגיטימית."}},
  {q:"(תוספת) איזה תנאי לבחירות דמוקרטיות עלול להיפגע? הסבר בקצרה.",a:{s:"התמודדות חופשית / הוגנת.",p:"תחרות הוגנת המבוססת על חופש הביטוי וחופש ההתאגדות.",q:"״מפלגות לא יורשו לפרסם תעמולת בחירות בשפה שאינה השפה הרשמית״.",l:"כלומר, מפלגות המיעוט מוגבלות ביכולתן להגיע לבוחרים, ולכן התחרות אינה הוגנת."}}]},
 {id:"e14",unit:"u4",title:"מצעד ברחוב מגורים",text:"ארגון ביקש לקיים תהלוכת מחאה נגד מדיניות הממשלה ברחוב מגורים צר בירושלים. תושבי הרחוב התנגדו וטענו שהתהלוכה תחסום את הכניסה לבתיהם ותפריע למנוחתם. המשטרה הודיעה כי התהלוכה תאושר, אך במסלול חלופי ברחוב ראשי סמוך, ובשעות שבהן ההפרעה לתושבים מינימלית.",subs:[
  {q:"א. ציין והצג את הזכות שהארגון ביקש לממש. הסבר.",a:{s:"חופש ההפגנה והמחאה.",p:"זכותו של כל אדם להביע בפומבי, במקום ציבורי, לבד או בקבוצה, את מחאתו על פעולות השלטון.",q:"״ארגון ביקש לקיים תהלוכת מחאה נגד מדיניות הממשלה״.",l:"כלומר, חברי הארגון רוצים לבטא יחד ובפומבי את התנגדותם למדיניות השלטון."}},
  {q:"ב. ציין והצג את העיקרון שעל פיו פעלה המשטרה. הסבר.",a:{s:"שקלול ואיזון בין זכויות (התנגשות בין זכויות).",p:"הזכויות יחסיות; כשהן מתנגשות משווים את חומרת הפגיעה בכל אחת ומחפשים פתרון שמאפשר מימוש מרבי של שתיהן, בפגיעה מעטה ככל האפשר.",q:"״התהלוכה תאושר, אך במסלול חלופי ברחוב ראשי סמוך, ובשעות שבהן ההפרעה לתושבים מינימלית״.",l:"כלומר, המשטרה לא ביטלה את ההפגנה ולא התעלמה מהתושבים: היא מצאה פתרון שמאפשר גם את חופש ההפגנה וגם את חופש התנועה והפרטיות של התושבים."}}]},
 {id:"e15",unit:"u4",title:"מלגות לפריפריה",text:"משרד החינוך הודיע על תוכנית לחמש השנים הבאות: סטודנטים מיישובי הפריפריה בנגב ובגליל, שבהם שיעור בעלי התואר נמוך משמעותית מהממוצע הארצי, יקבלו מלגה מלאה ונקודות זכות בקבלה לאוניברסיטה. סטודנטים מתל אביב טענו בעיתונות שהתוכנית פוגעת בהם, כי מועמדים עם ציונים נמוכים משלהם יתקבלו לפניהם.",subs:[
  {q:"א. ציין והצג את סוג המדיניות של משרד החינוך. הסבר.",a:{s:"העדפה מתקנת.",p:"מתן הטבה או העדפה לקבוצה מקופחת או חלשה, למשך זמן מסוים, במטרה לצמצם פערים ואי-שוויון.",q:"״לחמש השנים הבאות: סטודנטים מיישובי הפריפריה... שבהם שיעור בעלי התואר נמוך משמעותית מהממוצע הארצי, יקבלו מלגה מלאה ונקודות זכות״.",l:"כלומר, קבוצה חלשה (תושבי פריפריה עם פחות השכלה גבוהה) מקבלת הטבה, לזמן מוגבל של חמש שנים, כדי לסגור את פער ההשכלה. שלושת הרכיבים מתקיימים."}},
  {q:"ב. ציין את הזכות שלטענת הסטודנטים מתל אביב נפגעה. הסבר.",a:{s:"הזכות לשוויון.",p:"אין להפלות אדם בשל זהותו או שיוכו (כאן: מקום מגורים), אלא אם השונות רלוונטית.",q:"״מועמדים עם ציונים נמוכים משלהם יתקבלו לפניהם״.",l:"כלומר, לטענתם הם מקבלים יחס פחות טוב רק בגלל מקום המגורים, ולא בגלל כישוריהם. זה הוויכוח הציבורי על העדפה מתקנת: היא יוצרת אפליה כלפי פרטים אחרים."}}]},
 {id:"e16",unit:"u5",title:"תקציב המדינה",text:"בדיון על תקציב המדינה הציגו שני שרים עמדות שונות. שר א׳: ״המדינה צריכה לצאת מהשוק. נפריט את חברת החשמל, נוריד את מס החברות, ונצמצם את קצבאות הילדים. כשהכלכלה צומחת, גם המשפחות החלשות מרוויחות.״ שר ב׳: ״תפקיד המדינה הוא לדאוג שאף אחד לא ייפול. נעלה את המס על בעלי ההכנסות הגבוהות ביותר ונשתמש בכסף כדי לסבסד דיור ציבורי ולהבטיח קצבת קיום בכבוד.״",subs:[
  {q:"א. ציין והצג את הגישה החברתית-כלכלית של שר א׳. הסבר.",a:{s:"גישה ליברלית / ניאו-ליברלית.",p:"מדגישה חירות כלכלית על פני שוויון וסוברת שהחירות מקדמת את טובת כולם, כולל החלשים; דגש על שוק חופשי ויוזמה פרטית; מעורבות מינימלית של המדינה (הפרטה, קיצוץ, צמצום קצבאות) ומיסוי מינימלי.",q:"״נפריט את חברת החשמל, נוריד את מס החברות, ונצמצם את קצבאות הילדים. כשהכלכלה צומחת, גם המשפחות החלשות מרוויחות״.",l:"כלומר, השר מבקש לצמצם את מעורבות המדינה ואת המיסוי, ומאמין שהצמיחה בשוק החופשי תיטיב גם עם החלשים."}},
  {q:"ב. ציין והצג את הגישה של שר ב׳. הסבר.",a:{s:"גישה סוציאל-דמוקרטית.",p:"מדגישה שוויון חברתי-כלכלי וסולידריות; אחריות המדינה כלפי החלש; מעורבות רבה של המדינה (רשת ביטחון, סבסוד, שירותים חברתיים) ומיסוי גבוה על העשירונים העליונים.",q:"״נעלה את המס על בעלי ההכנסות הגבוהות ביותר ונשתמש בכסף כדי לסבסד דיור ציבורי ולהבטיח קצבת קיום בכבוד״.",l:"כלומר, השר רואה במדינה אחראית להבטיח קיום בסיסי לכל אדם, וממן זאת ממיסוי העשירים כדי לצמצם פערים."}}]},
 {id:"e17",unit:"u5",title:"שכר ושעות",text:"עובדות ניקיון בחברת קבלן פנו לבית הדין לעבודה. לטענתן, הן נדרשו לעבוד 12 שעות ביום ללא תשלום שעות נוספות, וחלקן קיבלו שכר נמוך משכר המינימום. החברה טענה שהעובדות חתמו מרצונן על החוזה.",subs:[
  {q:"ציין והצג את הזכות שעליה ביססו העובדות את פנייתן. הסבר.",a:{s:"זכויות עובדים (זכות חברתית-כלכלית).",p:"זכויות שהמדינה מחייבת את המעסיקים לתת לעובדים לפי חוק: הזכות לתנאי עבודה בסיסיים והוגנים, כמו שכר מינימום והגבלת שעות עבודה.",q:"״נדרשו לעבוד 12 שעות ביום ללא תשלום שעות נוספות, וחלקן קיבלו שכר נמוך משכר המינימום״.",l:"כלומר, המעסיק לא עמד בתנאים שהחוק מחייב: שכר מינימום והגבלת שעות. זכויות אלה מוקנות בחוק ואי אפשר לוותר עליהן בחוזה."}}]},
 {id:"e18",unit:"u6",title:"בתי הדין",text:"זוג מוסלמי אזרחי ישראל ביקש להתגרש. העניין נדון בבית הדין השרעי בנצרת, שבו הדיונים מתנהלים בערבית ולפי ההלכה המוסלמית. שופט הבית הדין הוא איש דת מוסלמי, ושכרו משולם על ידי המדינה.",subs:[
  {q:"ציין והצג את סוג הזכויות שבא לידי ביטוי בקטע. הסבר.",a:{s:"זכויות קבוצה.",p:"זכויות קיבוציות לקבוצות אתניות-תרבותיות ומיעוטים לאומיים, בתחומי שפה, חינוך, תרבות, דת וייצוג, שמטרתן להסדיר באופן מוסדי את הזהות הייחודית של הקבוצה. המדינה קובעת את היקפן.",q:"״העניין נדון בבית הדין השרעי... הדיונים מתנהלים בערבית ולפי ההלכה המוסלמית... שכרו משולם על ידי המדינה״.",l:"כלומר, המדינה מכירה במיעוט המוסלמי כקבוצה ומממנת מוסד שמאפשר לו לנהל את דיני המשפחה לפי דתו ובשפתו, וכך לשמור על זהותו הייחודית. זה ביטוי לגישה שמכירה בזכויות קבוצה."}}]}

const KNOW = [
 {id:"k1",unit:"u4",src:true,q:"הסבר את ההבדל בין זכויות פוליטיות של כל אדם לבין זכויות פוליטיות של אזרחים בלבד. הדגם זכות אחת מכל סוג.",a:"זכויות פוליטיות הן זכויות הקשורות לשותפות בניהול המסגרת המדינית ולהשפעה על השלטון. <b>זכויות פוליטיות של כל אדם</b> נובעות מהזכויות הטבעיות, ולכן אינן מוגבלות לאזרחי המדינה: כל מי שנמצא בה זכאי להן. דוגמה: חופש ההפגנה והמחאה, זכותו של אדם להביע בפומבי את מחאתו על פעולות השלטון (או: חופש המידע). <b>זכויות פוליטיות של אזרחים</b> מוקנות לאדם רק במדינה שבה הוא אזרח, כי הן קובעות את הרכב השלטון. דוגמה: הזכות להיבחר, שמחייבת אזרחות, גיל 21 והיעדר הרשעה בעבירה שיש עמה קלון (או: הזכות לבחור, הזכות להקים מפלגה)."},
 {id:"k2",unit:"u6",src:true,q:"מדינת ישראל מכירה בזכויות קבוצה ומעניקה אותן למיעוטים. (1) הצג שלושה תחומים שבהם מוענקות זכויות קבוצה למיעוט הערבי. (2) הצג שני תחומים שבהם באות לידי ביטוי זכויות קבוצה של מיעוטים יהודיים (כגון החרדים).",a:"<b>(1) המיעוט הערבי:</b> שפה: לערבית מעמד מיוחד, ופרסומים, שלטים ותקנות מסוימים חייבים להופיע גם בערבית. חינוך: מערכת חינוך נפרדת שמתנהלת בערבית ומלמדת גם את התרבות והמורשת של הקבוצה. דת: סמכות שיפוט לבתי הדין הדתיים (השרעיים ואחרים) בדיני משפחה. (אפשר גם: פטור קבוצתי מגיוס; ימי החג של המיעוט מוכרים כימי חופשה; ייצוג הולם בשירות הציבורי.)<br><b>(2) מיעוטים יהודיים:</b> חינוך: מערכת חינוך עצמאית לחרדים (וזרם ממלכתי-דתי). צבא: פטור או הסדר מיוחד בגיוס (בני ישיבות, ישיבות הסדר, שירות לאומי לבנות דתיות). (אפשר גם: סגירת רחובות לתנועה בשבת בשכונות חרדיות.)"},
 {id:"k3",unit:"u1",q:"הצג את רעיון האמנה החברתית, והסבר כיצד הוא מצדיק את קיום השלטון וגם מגביל אותו.",a:"<b>האמנה החברתית</b> היא הסכם בין בני אדם, בינם לבין עצמם ובינם לבין השלטון, שבו הם מוותרים על חלק מחירותם הטבעית, ובתמורה זוכים לביטחון ולהגנה על זכויותיהם. <b>מצדיקה:</b> הסמכות של השלטון לחוקק, לאכוף ולהעניש נובעת מהסכמת האזרחים, ולכן היא לגיטימית. <b>מגבילה:</b> השלטון קיים כדי להגן על הזכויות; לכן הוא מחויב לתנאי ההסכם, ואם הוא פוגע בזכויות שלשמן הוקם (לפי לוק), הוא מאבד את הלגיטימציה שלו. זהו הבסיס לרעיון ריבונות העם ולהכרה בזכויות האדם הטבעיות."},
 {id:"k4",unit:"u1",q:"השווה בין תפיסת מצב הטבע של הובס לזו של לוק בשני היבטים.",a:"<b>טבע האדם:</b> לפי הובס האדם רע מיסודו ויצרי (״אדם לאדם זאב״); לפי לוק האדם טוב ותבוני מיסודו. <b>מצב הטבע ומטרת השלטון:</b> לפי הובס מצב הטבע הוא מלחמת כולם בכולם ופחד תמידי, ולכן בני האדם מוותרים על חירותם לטובת שלטון חזק שיספק ביטחון; לפי לוק בני האדם חיו בחירות ושוויון ובשלום יחסי, עד שמעטים אלימים סיכנו את השלום, ולכן הקימו שלטון שתפקידו להגן על הזכויות הטבעיות: חיים, חירות וקניין."},
 {id:"k5",unit:"u1",q:"הסבר את ההבדל בין דמוקרטיה במובן הפורמלי לדמוקרטיה במובן המהותי.",a:"<b>דמוקרטיה פורמלית</b> היא דמוקרטיה כצורת ממשל: היא מתמקדת בכללי המשחק ובדרך קבלת ההחלטות, כמו שלטון העם, בחירות, הכרעת הרוב, הפרדת רשויות ושלטון החוק. <b>דמוקרטיה מהותית</b> היא דמוקרטיה כהשקפת עולם ערכית: היא מעמידה את האדם במרכז, רואה בזכויות האדם ערך עליון ומתמקדת בתוכן ההחלטות: האם הן מקדמות זכויות אדם, סובלנות, פלורליזם ושמירה על זכויות המיעוט. <b>ההבדל:</b> הפורמלית שואלת ״איך הוחלט״, המהותית שואלת ״מה הוחלט״. מדינה יכולה לקיים את הנהלים ובכל זאת לפגוע בזכויות, ולכן הפורמלית הכרחית אך אינה מספיקה."},
 {id:"k6",unit:"u2",q:"הצג שלושה מאפיינים של שיטת הבחירות בישראל, ויתרון וחיסרון אחד של השיטה.",a:"<b>ארצית:</b> כל הארץ אזור בחירה אחד לצורך חישוב התוצאות. <b>יחסית:</b> חלוקת המושבים בכנסת יחסית (בקירוב) למספר הקולות שקיבלה כל רשימה, בתנאי שעברה את אחוז החסימה (3.25%). <b>רשימתית:</b> מצביעים למפלגה עם רשימת מועמדים, ולא למועמד מסוים. <b>יתרון:</b> ייצוגיות. הכנסת משקפת את מגוון הקבוצות והדעות בחברה, ויש הלימה גבוהה בין רצון הבוחרים לחלוקת המושבים. <b>חיסרון:</b> ריבוי מפלגות פוגע ביציבות השלטונית ונותן כוח לא מידתי למפלגות קטנות, שיכולות לסחוט את הקואליציה. (או: אין קשר ישיר בין הבוחר לנבחר והיעדר ייצוג אזורי.)"},
 {id:"k7",unit:"u2",q:"הסבר את ההבדל בין דמוקרטיה פרלמנטרית לנשיאותית בשני היבטים.",a:"<b>מקור הרשות המבצעת:</b> בדמוקרטיה פרלמנטרית הממשלה צומחת מתוך הפרלמנט, וראש הממשלה הוא בדרך כלל ראש הסיעה או הקואליציה הגדולה. בדמוקרטיה נשיאותית הנשיא נבחר ישירות על ידי העם, בבחירות נפרדות מהפרלמנט. <b>תלות:</b> בדמוקרטיה פרלמנטרית הממשלה תלויה באמון הפרלמנט, שיכול להפילה בהצבעת אי-אמון. בדמוקרטיה נשיאותית הנשיא מכהן תקופה קצובה ואינו תלוי באמון הפרלמנט (הדחה רק בהליך חריג). (היבט נוסף: בנשיאותית הנשיא הוא גם ראש המדינה; בפרלמנטרית ראש המדינה הוא דמות נפרדת וסמלית.)"},
 {id:"k8",unit:"u2",q:"הצג את חמשת התנאים לקיום בחירות דמוקרטיות.",a:"<b>כלליות:</b> כל אזרחי המדינה זכאים לבחור ולהיבחר, במגבלות החוק (כמו גיל). <b>חשאיות:</b> איש מלבד הבוחר לא יודע במי בחר, כדי שלא יושפע מלחצים. <b>מחזוריות:</b> הבחירות חוזרות במרווחי זמן קבועים וידועים בחוק. <b>שוויוניות:</b> קולו של כל מצביע שווה לקולו של כל מצביע אחר. <b>התמודדות חופשית / הוגנת:</b> תחרות הוגנת בין מתמודדים, המבוססת על חופש הביטוי וחופש ההתאגדות."},
 {id:"k9",unit:"u3",q:"הצג את עקרון הכרעת הרוב, והסבר מתי הכרעת הרוב הופכת לעריצות הרוב.",a:"<b>עקרון הכרעת הרוב:</b> מתוך כמה אפשרויות נבחרת זו שרוב האוכלוסייה / הנציגים / המצביעים תומכים בה, אך אסור לרוב לקבל החלטות שפוגעות באופן לא סביר בזכויות יסוד, ובמיוחד בזכויות המיעוט. <b>עריצות הרוב</b> היא שימוש לרעה בעיקרון: כאשר הרוב מנצל את כוחו ופוגע באופן לא מידתי בזכויות אדם ואזרח (כמו חופש הביטוי וההתארגנות), שולל מהמיעוט את האפשרות לבטא את דעותיו ולשכנע את הציבור, או פוגע בכללי המשחק הדמוקרטיים (למשל מבטל בחירות). הרוב חייב להגביל את כוחו גם משום שהמיעוט של היום עשוי להיות הרוב של מחר."},
 {id:"k10",unit:"u4",q:"הסבר מדוע זכויות האדם הן יחסיות, והצג שתי עילות שבגללן מותר להגביל זכות.",a:"הזכויות <b>יחסיות ולא מוחלטות</b>: הן מתנגשות לא פעם זו בזו או עם אינטרס ציבורי, ואין חברה שבה ניתן לממש את כולן במלואן. לכן נדרש <b>שקלול ואיזון</b>: משווים את חומרת הפגיעה בכל זכות ומחפשים פתרון שמאפשר מימוש מרבי של שתיהן, בפגיעה מעטה ככל האפשר. <b>עילות להגבלה:</b> (1) כאשר מימוש הזכות פוגע בזכויות הזולת. (2) כאשר יש סכנה ברורה ומיידית לחיי הציבור ולביטחונו. (אפשר גם: כאשר יש עבירה על החוק.)"},
 {id:"k11",unit:"u4",q:"הסבר את ההבדל בין הבחנה מותרת להעדפה מתקנת, והדגם כל אחת.",a:"<b>הבחנה מותרת</b> היא מתן יחס שונה לבני אדם כאשר השונות רלוונטית לנושא הנידון. דוגמה: הארכת זמן בבגרות לתלמיד עם לקות למידה. <b>העדפה מתקנת</b> היא מתן הטבה לקבוצה מקופחת או חלשה, למשך זמן מסוים, במטרה לצמצם פערים. דוגמה: חובת ייצוג הולם לערבים ולנשים בשירות המדינה. <b>ההבדל:</b> בהבחנה היחס השונה נובע מצורך או מאפיין רלוונטי של הפרט, ואינו מוגבל בזמן; בהעדפה מתקנת היחס השונה נועד לתקן קיפוח של קבוצה, והוא זמני עד שהפער ייסגר."},
 {id:"k12",unit:"u4",q:"הצג את רעיון הזכויות הטבעיות, ושלוש זכויות טבעיות.",a:"<b>רעיון הזכויות הטבעיות</b> הוא תפיסה מוסרית-פוליטית שלפיה לכל אדם, באשר הוא אדם, יש זכויות יסוד. הן טבעיות כי אינן מוענקות על ידי השלטון ואינן תלויות בו; הן קודמות למדינה, ותפקיד השלטון הדמוקרטי הוא לשמור עליהן. <b>דוגמאות:</b> הזכות לחיים ולביטחון (אין לפגוע בחייו ובגופו של אדם, והמדינה חייבת להגן עליו); זכות הקניין (לכל אדם זכות להחזיק ברכוש ולעשות בו כרצונו); הזכות להליך הוגן (אדם חף מפשע עד שהוכחה אשמתו, וזכאי למשפט הוגן ופומבי)."},
 {id:"k13",unit:"u5",q:"השווה בין הגישה הליברלית לגישה הסוציאל-דמוקרטית בשני היבטים.",a:"<b>הערך המועדף:</b> הגישה הליברלית מעדיפה חירות כלכלית על פני שוויון, וסוברת שהחירות מקדמת את טובת כולם, גם החלשים. הגישה הסוציאל-דמוקרטית מעדיפה שוויון חברתי-כלכלי וסולידריות, ושואפת לצמצם פערים. <b>מעורבות המדינה:</b> לפי הגישה הליברלית מעורבות המדינה מינימלית: שוק חופשי, הפרטה, קיצוץ תקציבים וקצבאות ומיסוי נמוך. לפי הגישה הסוציאל-דמוקרטית המדינה מעורבת מאוד: רשת ביטחון סוציאלי, סבסוד שירותים, חקיקה חברתית ומיסוי גבוה על העשירונים העליונים."},
 {id:"k14",unit:"u5",q:"הצג מהן זכויות חברתיות-כלכליות, והסבר במה הן שונות מזכויות האדם הטבעיות.",a:"<b>זכויות חברתיות-כלכליות</b> הן זכויות שהמדינה מעניקה, בדרך של הקצאת משאבים ושירותים, כדי להבטיח לכל אדם קיום אנושי בכבוד ורמת חיים בסיסית: בריאות, חינוך, ביטחון סוציאלי, דיור, זכויות עובדים. היקפן תלוי במדיניות החברתית-כלכלית, ובמדינות רבות הן ניתנות באופן מוגבל. <b>ההבדל:</b> זכויות טבעיות קודמות למדינה ואינן מוענקות על ידה; תפקיד המדינה הוא להימנע מפגיעה בהן ולהגן עליהן. זכויות חברתיות-כלכליות מוענקות על ידי המדינה ותלויות במשאביה ובמדיניותה."},
 {id:"k15",unit:"u6",q:"הצג את שתי הגישות להכרה בזכויות קבוצה, והדגם מדינה לכל גישה.",a:"<b>גישת האחדה מלאה:</b> אין הכרה בזכויות הייחודיות של קבוצות מיעוט. המדינה מחויבת לפרטים ולא לקבוצות, ויכולה לפעול להטמעת המיעוט בתרבות השלטת. דוגמה: צרפת, שבה יש שפה אחת ותרבות אחת שלטת. <b>גישת הכרה מלאה:</b> יש הכרה בזכויות הייחודיות של המיעוט, והמדינה מעניקה לו אמצעים לשמור על זהותו: משאבים ואף אוטונומיה. דוגמה: קנדה, מדינה רב-תרבותית שנותנת למיעוטים ייצוג ואוטונומיה. (ישראל מכירה בזכויות קבוצה; ארה״ב באמצע: לא מכירה ולא מתקצבת, אבל מאפשרת לקבוצות לשמור על ייחודן באופן פרטי.)"},
 {id:"k16",unit:"u2",q:"הצג את עקרון שלטון העם, והסבר את ההבדל בין דמוקרטיה ישירה לייצוגית.",a:"<b>עקרון שלטון העם</b> הוא עקרון יסוד של הדמוקרטיה: כלל האזרחים הם הריבון ומקור הסמכות לשלטון, והם בוחרים שלטון של נציגים לזמן קצוב שנקבע בחוק. <b>בדמוקרטיה ישירה</b> כלל האזרחים מקבלים את ההחלטות בענייני המדינה בעצמם, ללא נציגים (כמו באתונה העתיקה, או במשאל עם). <b>בדמוקרטיה ייצוגית</b> האזרחים בוחרים נציגים, והנציגים מקבלים את ההחלטות ומקדמים מדיניות בשמם. רוב המדינות ייצוגיות, כי גודלן, מורכבות הנושאים וחוסר הזמן והמידע של האזרחים אינם מאפשרים החלטה ישירה בכל עניין."}
];

const EXPLAIN = {
u1:{
 q:"למה בכלל לציית לשלטון, ומתי שלטון הוא דמוקרטי באמת?",
 chain:["מצב הטבע","הובס / לוק","האמנה החברתית","סמכות מהעם","דמוקרטיה פורמלית","דמוקרטיה מהותית"],
 body:`
<p>השלטון מחוקק, גובה מסים ומעניש. <mark>מאיפה יש לו זכות לעשות את זה?</mark> הוגי המאות ה-17 וה-18 ענו בניסוי מחשבתי: דמיינו עולם בלי מדינה, בלי חוקים ובלי משטרה. זה <b>מצב הטבע</b>.</p>
<h4>שתי תמונות של מצב הטבע</h4>
<p><b>הובס</b> כתב אחרי מלחמת אזרחים עקובה מדם. לדעתו האדם אנוכי ויצרי, ובלי שלטון כל אחד מאיים על כל האחרים: ״אדם לאדם זאב״, מלחמת כולם בכולם. המסקנה שלו: עדיף שליט חזק מכאוס. <mark>ביטחון קודם לחירות.</mark></p>
<p><b>לוק</b> מאמין שהאדם תבוני וטוב. במצב הטבע כבר יש לאדם זכויות טבעיות: חיים, חירות וקניין. הבעיה היא שמעטים אלימים מסכנים אותן, ואין מי שישפוט ויאכוף. לכן מקימים שלטון, ש<mark>תפקידו להגן על הזכויות</mark>. שלטון שפוגע בהן מפר את ההסכם, והעם רשאי להחליף אותו.</p>
{{f:c_hl|טבע האדם: הובס מול לוק}}
<h4>האמנה החברתית: הגשר</h4>
<p>בני האדם מסכימים, מרצונם, <b>לוותר על חלק מחירותם</b>, ובתמורה מקבלים <b>ביטחון והגנה על זכויותיהם</b>.</p>
<p>מהרעיון הזה נגזרות שתי מסקנות שמלוות את כל החומר:</p>
<ul><li><b>הצדקה:</b> הסמכות של השלטון באה מהסכמת העם. מכאן <a href="#u2">עקרון שלטון העם</a>.</li>
<li><b>הגבלה:</b> השלטון קיים בשביל מטרה, והוא כפוף לה. מכאן <a href="#u4">זכויות האדם</a> וההגבלה על <a href="#u3">כוח הרוב</a>.</li></ul>
<h4>שני מבחנים לדמוקרטיה</h4>
{{svg:house|הפורמלית היא היסודות; המהותית היא הקומה שנבנית עליהם}}
<p><b>פורמלית</b> בודקת את הדרך: האם ההחלטה התקבלה לפי כללי המשחק (בחירות, רוב, שלטון החוק)? <b>מהותית</b> בודקת את התוכן: האם ההחלטה מכבדת את האדם, את זכויותיו ואת המיעוט?</p>
<p class="ex">חוק שעובר ברוב בכנסת ושולל ממיעוט את זכות ההצבעה עובר את המבחן הפורמלי ונכשל במבחן המהותי. לכן הפורמלית <b>הכרחית אבל לא מספיקה</b>.</p>`,
 exam:["בשאלת ״איזה מובן של דמוקרטיה״: חפשו מה הדובר מדגיש. נהלים, בחירות, ״נבחרנו ברוב״ = פורמלית. זכויות, כבוד, מיעוט, חינוך לערכים = מהותית.","כשנשאלים על הובס ולוק, לציין את ההבדל בטבע האדם ובמטרת השלטון. רק ״הובס חושב שהאדם רע״ לא מספיק.","האמנה החברתית: שני הצדדים של העסקה חייבים להופיע בתשובה: על מה מוותרים ומה מקבלים."]
},
u2:{
 q:"העם הוא הריבון. איך מתרגמים את זה לממשל בפועל?",
 chain:["שלטון העם","ישירה / ייצוגית","משאל עם","פרלמנטרית / נשיאותית","5 תנאי בחירות","שיטת הבחירות בישראל"],
 body:`
<p><b>שלטון העם</b> פירושו שכלל האזרחים הם מקור הסמכות. יש שתי דרכים לממש את זה.</p>
<h4>ישירה או ייצוגית</h4>
<p>באתונה העתיקה האזרחים התכנסו בכיכר והחליטו בעצמם: <b>דמוקרטיה ישירה</b>.</p>
{{f:r7|הצבעה בכיכר העיר באתונה העתיקה}}
<p>במדינה מודרנית זה לא אפשרי: יש יותר מדי אזרחים, אין להם זמן ומידע להעמיק בכל סוגיה, ויש נושאים חסויים. לכן רוב המדינות הן <b>ייצוגיות</b>: האזרחים בוחרים נציגים <mark>לזמן קצוב</mark>, ואם התאכזבו, מחליפים אותם. ״זמן קצוב״ הוא לב העניין: הוא מה שהופך בחירות לתנאי הכרחי.</p>
<p><b>משאל עם</b> הוא כלי ישיר בתוך מערכת ייצוגית: שאלה אחת מוגדרת שמופנית לכל הבוחרים, בדרך כלל בהכרעה גורלית (בריטניה, ברקזיט 2016). היתרון: לגיטימציה. החיסרון: סוגיה מורכבת הופכת ל״כן/לא״.</p>
{{f:r1|משאל עם: שאלה אחת, ״כן״ או ״לא״}}
<h4>שני דגמים לייצוג</h4>
<p>ההבדל כולו בשאלה אחת: <mark>מי בוחר את ראש הרשות המבצעת, ובאמון של מי הוא תלוי?</mark></p>
<ul><li><b>פרלמנטרית</b> (ישראל): העם בוחר פרלמנט, ומתוכו צומחת הממשלה. הפרלמנט יכול להפיל אותה בהצבעת אי-אמון.</li>
<li><b>נשיאותית</b> (ארה״ב): העם בוחר נשיא ישירות, ובנפרד בוחר פרלמנט. הנשיא מכהן תקופה קבועה ולא תלוי באמון הפרלמנט.</li></ul>
{{svg:parl|מי בוחר את מי, ובאמון של מי הממשלה תלויה}}
{{f2:r9|״מי שמצביע משפיע״|r11|בחירות שוב ושוב: ועדת הקלפי כבר הפכה לשלדים}}
<h4>חמשת התנאים: כל אחד שומר על משהו אחר</h4>
{{svg:five|חמשת התנאים לבחירות דמוקרטיות (כ״ח מש״ה)}}
<p><b>כלליות</b> שואלת מי משתתף. <b>שוויוניות</b> שואלת כמה שווה כל קול. <b>חשאיות</b> שומרת שהבוחר חופשי מלחץ. <b>מחזוריות</b> שומרת על האפשרות להחליף את השלטון. <b>התמודדות חופשית</b> שומרת שיש בין מה לבחור. כשמזהים מה נפגע בקטע, שואלים: <mark>איזו מהשאלות האלה נפגעה?</mark></p>
<h4>השיטה בישראל: שלוש תשובות לשלוש שאלות</h4>
<ul><li><b>איפה סופרים?</b> בכל הארץ יחד: <b>ארצית</b>.</li><li><b>איך קולות הופכים למושבים?</b> באופן יחסי: <b>יחסית</b>.</li><li><b>למי מצביעים?</b> לרשימת מפלגה: <b>רשימתית</b>.</li></ul>
<p>היחסיות מייצרת את הוויכוח המרכזי: <b>ייצוג</b> רחב של כל הקבוצות, מול <b>יציבות</b> שנפגעת מריבוי מפלגות. אחוז החסימה (3.25%) הוא ניסיון לאזן ביניהם.</p>`,
 exam:["כלליות או שוויוניות? אם קבוצה שלמה לא מצביעה בכלל: כלליות. אם כולם מצביעים אבל לקולות משקל שונה: שוויוניות.","דחיית בחירות פוגעת במחזוריות, ובשאלה על ״עיקרון״ גם בשלטון העם, כי הנציגים מכהנים מעבר לזמן שקיבלו.","יתרון וחיסרון של השיטה: תמיד להסביר את הקשר. לא ״יש הרבה מפלגות״, אלא ״ריבוי מפלגות → קואליציה שבירה → חוסר יציבות״."]
},
u3:{
 q:"למה הרוב מכריע, ולמה הוא לא יכול להחליט כל דבר?",
 chain:["כל קול שווה","הכרעת הרוב","גבול: זכויות היסוד","עריצות הרוב","פורמלי מול מהותי"],
 body:`
<p>אם כל קול שווה, ההחלטה צריכה להיות זו שרוב הקולות תומכים בה. זו <b>הכרעת הרוב</b>, והיא מאפשרת לחברה מפולגת להכריע <mark>בלי אלימות</mark>, לפי כללים שכולם הסכימו עליהם מראש. היא מופיעה בבחירות, בכנסת, בממשלה וגם בהרכבי שופטים.</p>

<h4>הרכיב השני, שתלמידים שוכחים</h4>
<p>ההגדרה במחוון כוללת שני חלקים. הרוב מכריע, <mark>אבל אסור לו לפגוע באופן לא סביר בזכויות יסוד, ובמיוחד בזכויות המיעוט.</mark> למה?</p>
<ul><li>הזכויות טבעיות. הן לא מתנה מהרוב, ולכן הרוב לא יכול לקחת אותן (<a href="#u1">לוק</a>).</li>
<li>המיעוט של היום עשוי להיות הרוב של מחר. כללים שמגנים על המיעוט מגנים על כולם.</li>
<li>אם הרוב יכול לבטל בחירות או להשתיק את האופוזיציה, הדמוקרטיה מחסלת את עצמה.</li></ul>
<h4>עריצות הרוב</h4>
{{f:m7|שלטון הרוב, או עריצות הרוב?}}
<p>כשהרוב משתמש בכוחו לרעה ופוגע באופן לא מידתי במיעוט, בזכויות או בכללי המשחק, זו <b>עריצות הרוב</b>. ההחלטה יכולה להתקבל לגמרי לפי הנהלים ועדיין להיות עריצות.</p>
<p class="ex">הכנסת מאשרת את תקציב המדינה ברוב: הכרעת הרוב. הכנסת אוסרת ברוב על מפלגות המיעוט לפרסם תעמולה בשפתן: עריצות הרוב.</p>
<p>כאן מתחבר <a href="#u1">נושא 1</a>: הכרעה לפי הנהלים היא ביטוי ל<b>מובן הפורמלי</b>. הגבלת הרוב ומניעת עריצות הן ביטוי ל<b>מובן המהותי</b>.</p>
<h4>סוגי רוב (מושג רקע)</h4>
{{svg:seats|120 חברי הכנסת: איפה עובר כל סוג רוב}}
<p><b>רגיל</b>: יותר בעד מנגד מבין המצביעים. <b>מוחלט</b>: יותר ממחצית מכלל החברים (בכנסת 61, למשל בהצבעת אי-אמון). <b>מיוחס</b>: מספר שנקבע מראש וגדול מזה (למשל 80 ח״כים כדי להאריך את כהונת הכנסת).</p>`,
 exam:["בהגדרה של הכרעת הרוב חובה לכתוב את שני הרכיבים. ״מה שהרוב רוצה״ לבד שווה חצי.","לזהות עריצות: האם ההחלטה פוגעת במיעוט מסוים, ביכולת שלו להתבטא, להתארגן או להשתתף בבחירות? אם כן, זו עריצות, גם אם התקבלה ברוב גדול.","אל תתבלבלו עם גישת האחדה מלאה (נושא 6): שם מדובר במדיניות כלפי זהות תרבותית, כאן בשימוש לרעה בכוח ההצבעה."]
},
u4:{
 q:"אילו זכויות יש לכל אדם, ואיך מכריעים כשהן מתנגשות?",
 chain:["זכויות טבעיות","כ·ח·ה·ח·ש·ק","שוויון: 3 מדיניויות","זכויות פוליטיות","חובות","יחסיות ואיזון"],
 body:`
<p><b>רעיון הזכויות הטבעיות</b> אומר שלכל אדם יש זכויות רק מפני שהוא אדם. המילה ״טבעיות״ היא העיקר: <mark>המדינה לא נותנת אותן, היא רק מחויבת להגן עליהן.</mark> בישראל הן מעוגנות בעיקר בחוק יסוד: כבוד האדם וחירותו (1992).</p>
<h4>שש הזכויות: כ·ח·ה·ח·ש·ק</h4>
{{f:letters|כבוד · חירות · הליך הוגן · חיים וביטחון · שוויון · קניין}}
<p><b>כ</b>בוד (כולל פרטיות ושם טוב), <b>ח</b>ירות, <b>ה</b>ליך הוגן, <b>ח</b>יים וביטחון, <b>ש</b>וויון, <b>ק</b>ניין. מהחירות נגזרות חירויות ספציפיות: ביטוי, מחשבה ומצפון, תנועה, עיסוק, דת ומדת. במבחן <mark>תמיד לציין את הספציפית</mark>: ״חופש התנועה״, לא ״הזכות לחירות״.</p>
<p><b>חירות</b> יש לה שני צדדים: <b>חירות ל-</b> (לפעול כרצוני) ו<b>חירות מ-</b> (שלא יעצרו אותי, יחדרו לחיי או ירדפו אותי).</p>
<h4>שוויון: עץ החלטה לשלוש המדיניויות</h4>
<p>שוויון לא אומר יחס זהה לכולם. השאלה היא <mark>האם ההבדל ביחס מוצדק</mark>:</p>
<ol class="tree"><li>האם יש יחס שונה בין אנשים? אם לא, אין שאלה.</li>
<li>האם ההבדל רלוונטי לעניין? אם לא, זו <b>אפליה פסולה</b>.</li>
<li>אם כן: האם זו הטבה לקבוצה מקופחת, לזמן מסוים, כדי לסגור פער? אם כן, זו <b>העדפה מתקנת</b>.</li>
<li>אחרת, יחס לפי צורך רלוונטי: <b>הבחנה מותרת</b>.</li></ol>
{{svg:tree|עץ ההחלטה לסוג המדיניות}}
<p>לשוויון יש גם שני מובנים: <b>מצומצם</b> (שוויון בפני החוק ושוויון פוליטי) ו<b>רחב</b> (שוויון הזדמנויות כלכלי-חברתי, שמוביל ל<a href="#u5">נושא 5</a>).</p>
<h4>זכויות פוליטיות: מבחן אחד</h4>
<p>שאלו: <mark>האם הפעולה דורשת אזרחות?</mark> הפגנה, מחאה, דרישת מידע מהרשויות (חוק חופש המידע, 1998) וביקורת על השלטון: לכל אדם. לבחור, להיבחר ולהקים מפלגה: לאזרחים בלבד. להיבחר לכנסת: אזרח, מגיל 21, בלי הרשעה בעבירה שיש עמה קלון בשבע השנים האחרונות.</p>
<h4>חובות</h4>
<p><b>חובת האדם</b> היא לכבד את זכויות הזולת. <b>חובות האזרח</b> הן ציות לחוק, תשלום מסים ושירות. ובדמוקרטיה אין התניה: <mark>מי שלא ממלא חובה נענש, אבל זכויות היסוד שלו לא נשללות.</mark></p>
<h4>הזכויות יחסיות</h4>
<p>זכויות מתנגשות זו בזו (הפגנה מול מנוחת השכנים) או עם אינטרס ציבורי (ביטחון). מותר להגביל זכות כשהיא פוגעת בזכויות הזולת, כשיש סכנה ברורה ומיידית לשלום הציבור, או כשיש עבירה על החוק. גם אז עושים <b>שקלול ואיזון</b>: מחפשים פתרון שמממש את שתי הזכויות ככל האפשר, בפגיעה מינימלית.</p>
<p class="ex">המשטרה מאשרת הפגנה, אבל במסלול חלופי ובשעות שלא מפריעות לתושבים. שתי הזכויות נשמרות, כל אחת עם פגיעה קטנה.</p>`,
 exam:["״איזו זכות נפגעה לטענת X״: עונים מנקודת המבט של X, גם אם אינו צודק.","העדפה מתקנת: שלושה רכיבים, ו״לזמן מסוים״ הוא הנשכח. אם הקטע לא מדבר על קבוצה מקופחת ופער, זו כנראה הבחנה מותרת.","חיפוש בתיק = פרטיות, כלומר הזכות לכבוד. החרמת התיק או נזק לו = קניין.","בשאלת התנגשות: לציין את שתי הזכויות, להציג כל אחת, ולהסביר את פתרון האיזון."]
},
u5:{
 q:"מה המדינה חייבת לתת לאזרחיה, וכמה?",
 chain:["זכויות טבעיות (הגנה)","זכויות חברתיות (הקצאה)","מתח חירות–שוויון","ליברלית","סוציאל-דמוקרטית"],
 body:`
<p>זכויות טבעיות דורשות מהמדינה בעיקר <b>לא לפגוע</b>. <b>זכויות חברתיות-כלכליות</b> דורשות ממנה <mark>לתת</mark>: בריאות, חינוך, דיור, קצבאות וזכויות עובדים, כדי שלכל אדם יהיה קיום בכבוד. מאחר שהן עולות כסף ותלויות במשאבים, <mark>היקפן נקבע במדיניות</mark>, ובמדינות רבות הן ניתנות באופן מוגבל.</p>
<p class="ex">בישראל: חוק לימוד חובה (1949), חוק שכר מינימום (1987), חוק ביטוח בריאות ממלכתי (1994, סל הבריאות), קצבאות הביטוח הלאומי.</p>
<h4>המתח שמאחורי הוויכוח</h4>
{{svg:seesaw|שתי הגישות הן שני כיוונים על אותה נדנדה}}
<p>שני ערכי היסוד של הדמוקרטיה הם <b>חירות</b> ו<b>שוויון</b>, והם מושכים לכיוונים הפוכים. יותר חירות כלכלית מגדילה פערים. יותר שוויון מחייב את המדינה להתערב, לגבות מסים ולחלק, וזה מגביל את החירות. שתי הגישות הן שתי תשובות למתח הזה.</p>
<h4>ליברלית / ניאו-ליברלית</h4>
<p>מעדיפה <b>חירות כלכלית</b>. שוק חופשי, תחרות ויוזמה פרטית יוצרים צמיחה, ו<mark>הצמיחה תיטיב גם עם החלשים</mark>. לכן המדינה מתערבת מעט: הפרטה, קיצוצים, צמצום קצבאות ומסים נמוכים.</p>
<h4>סוציאל-דמוקרטית</h4>
<p>מעדיפה <b>שוויון וסולידריות</b>. <mark>המדינה אחראית לחלש</mark> וחייבת להבטיח קיום בכבוד לכל אדם. לכן היא מתערבת הרבה: רשת ביטחון סוציאלי, סבסוד, שירותים ציבוריים, חקיקה חברתית ומסים גבוהים על העשירונים העליונים.</p>`,
 exam:["בשאלת ״איזו גישה״: חפשו כלים (הפרטה, קיצוץ, הורדת מסים לעומת סבסוד, הלאמה, מס על עשירים) וגם את הנימוק (״הצמיחה תיטיב עם כולם״ לעומת ״אחריות המדינה כלפי החלש״).","זכויות עובדים: חובה דוגמה אחת לפחות, כמו שכר מינימום, הגבלת שעות או הגנה מפיטורים שרירותיים.","להבדיל: הדרישה שהמדינה לא תפגע היא זכות טבעית. הדרישה שהמדינה תספק היא זכות חברתית-כלכלית."]
},
u6:{
 q:"מה מגיע לאדם לא כפרט, אלא כחלק מקבוצה?",
 chain:["קבוצת מיעוט","זכויות קבוצה","האחדה מלאה ↔ הכרה מלאה","ישראל: ערבים","ישראל: מיעוטים יהודיים"],
 body:`
<p>לבני מיעוט יש את כל זכויות הפרט: שוויון, הצבעה, חופש ביטוי. אבל זהות של אדם קשורה גם לשפה, לדת ולתרבות של הקבוצה שלו, ו<mark>את אלה אי אפשר לשמר לבד</mark>. צריך בית ספר בשפה שלך, בית דין לפי הדת שלך, ייצוג לקבוצה. אלה <b>זכויות קבוצה</b>: הן ניתנות לאדם כחבר בקבוצה, ומטרתן להסדיר באופן מוסדי את הזהות הייחודית שלה.</p>
<p>ההבדל החשוב: זכויות הפרט של בני המיעוט הן זכויות יסוד בכל דמוקרטיה, ואילו את היקף זכויות הקבוצה <mark>כל מדינה קובעת בעצמה</mark>.</p>
<h4>הרצף</h4>
{{f:spectrum|מהאחדה מלאה (צרפת) ועד הכרה מלאה (קנדה). ישראל קרובה לקצה ההכרה}}
<ul><li><b>האחדה מלאה</b> (צרפת): המדינה מחויבת לפרטים בלבד. אין הכרה בקבוצות, ויש שאיפה להטמיע את המיעוט בתרבות השלטת.</li>
<li><b>אמצע</b> (ארה״ב): המדינה לא מכירה ולא מממנת, אבל גם לא מונעת מקבוצות לשמור על ייחודן באופן פרטי.</li>
<li><b>הכרה מלאה</b> (קנדה): המדינה מקצה משאבים, ייצוג ואף אוטונומיה כדי שהמיעוט ישמור על זהותו.</li></ul>
<h4>ישראל מכירה בזכויות קבוצה</h4>
<p><b>למיעוט הערבי:</b> מעמד מיוחד לשפה הערבית, מערכת חינוך נפרדת בערבית, סמכות לבתי הדין הדתיים בדיני משפחה, פטור קבוצתי מגיוס, ייצוג הולם בשירות הציבורי וחגים מוכרים.</p>
<p><b>למיעוטים יהודיים:</b> חינוך עצמאי חרדי וזרם ממלכתי-דתי, הסדרי גיוס (ישיבות, ישיבות הסדר, שירות לאומי לבנות דתיות), וסגירת רחובות בשבת בשכונות חרדיות.</p>`,
 exam:["ערבי שמצביע לכנסת או מקים מפלגה מממש זכות אזרח, לא זכות קבוצה. זכות קבוצה תמיד קשורה לשימור זהות: שפה, חינוך, תרבות, דת או ייצוג כקבוצה.","מילות מפתח להאחדה: הטמעה, תרבות שלטת, שפה אחת, מניעת פיצול. להכרה: תקציב לחינוך המיעוט, אוטונומיה, ייצוג מובטח.","בשאלה ״הצג שלושה תחומים״: לכתוב תחום ודוגמה קונקרטית לכל אחד, לא רק רשימה."]
}
};

 {u:"u4",passage:"עיתון פרסם כתבה שקרית שלפיה רופא ידוע הורשע בעבר בגניבה. הרופא תבע את העיתון.",q:"ציין והצג את הזכות שהרופא ביקש להגן עליה. הסבר.",ans:"הזכות לשם טוב, כחלק מהזכות לכבוד: הזכות שלא יפרסמו על אדם מידע שקרי שלילי, ושלא יהיה נתון ליחס משפיל ומבזה. בקטע כתוב: ״עיתון פרסם כתבה שקרית שלפיה רופא ידוע הורשע בעבר בגניבה״. כלומר, פורסם על הרופא מידע שקרי שפוגע בשמו ובמעמדו המקצועי, ולכן נפגעה זכותו לשם טוב.",flaw:"תקין",fix:"תשובה מלאה ומדויקת: הזכות הספציפית (שם טוב) והזכות הכללית (כבוד), ציטוט ממוקד, וקישור שמסביר למה הפרסום פוגע."},
 {u:"u2",passage:"בעיר מסוימת החליטה העירייה לשאול את כל התושבים, בהצבעה כללית, אם לסגור את מרכז העיר לרכבים פרטיים. התוצאה תחייב את מועצת העיר.",q:"ציין והצג את הכלי הדמוקרטי שבו השתמשה העירייה. הסבר.",ans:"דמוקרטיה ישירה. כלל האזרחים מקבלים את ההחלטות ללא נציגים. בקטע כתוב: ״לשאול את כל התושבים, בהצבעה כללית״. כלומר, התושבים עצמם מחליטים ולא הנציגים.",flaw:"ציין",fix:"השאלה ביקשה ״כלי״. התשובה המדויקת: משאל עם, שאלה מוגדרת לכלל הבוחרים, כלי של דמוקרטיה ישירה, מחייב או מייעץ (כאן מחייב). ״דמוקרטיה ישירה״ הוא סוג הדמוקרטיה, לא הכלי."}
];

/* cards */
const CARDS=[];UNITS.forEach(u=>u.defs.forEach((d,i)=>CARDS.push({id:u.id+"-"+i,u:u.id,t:d.t,c:d.c})));
const INT=[0,1,2,4,7,14];
const cardState=id=>S.cards[id]||{box:0,due:0};
const dueCards=()=>CARDS.filter(c=>{const s=cardState(c.id);return s.box>0&&s.due<=today()});
const newCards=()=>CARDS.filter(c=>cardState(c.id).box===0);

/* quote items */
const QITEMS=[];EVENTS.forEach(e=>e.subs.forEach((s,i)=>QITEMS.push({id:e.id+"-"+i,e,s,u:e.unit})));
function sentences(t){return t.split(/(?<=[.!?][״"׳']?)\s+/).map(x=>x.trim()).filter(Boolean)}
function keyFrag(q){const clean=q.replace(/[״"]/g,"").replace(/[.]$/,"");const parts=clean.split(/\.\.\.|…/).map(x=>x.trim()).filter(x=>x.length>5);parts.sort((a,b)=>b.length-a.length);return (parts[0]||clean).slice(0,18)}
function goodSentences(item){const f=keyFrag(item.s.a.q);const ss=sentences(item.e.text);return ss.map((s,i)=>s.replace(/[״"]/g,"").includes(f)?i:-1).filter(i=>i>=0)}

/* mastery */
function mastery(u){
  const cs=CARDS.filter(c=>c.u===u);const cardScore=cs.reduce((a,c)=>a+Math.min(cardState(c.id).box,4)/4,0)/cs.length;
  const ds=DRILL.map((d,i)=>[d,i]).filter(([d])=>d.u===u);const dAns=ds.filter(([d,i])=>i in S.drill);
  const drillScore=dAns.length?dAns.filter(([d,i])=>S.drill[i]).length/ds.length:0;
  const qs=QITEMS.filter(q=>q.u===u);const qScore=qs.length?qs.filter(q=>S.quote[q.id]).length/qs.length:0;
  return Math.round(100*(cardScore*.4+drillScore*.35+qScore*.25));
}

function buildPlan(){
  if(!S.exam)return "";
  const ex=new Date(S.exam);ex.setHours(0,0,0,0);const days=Math.round((ex-today())/DAY);
  if(days<0)return `<p class="muted small">התאריך עבר. עדכן תאריך מבחן.</p>`;
  if(days===0)return `<ul class="plan"><li class="today"><span class="d">היום</span><span><b>מבחן.</b> בבוקר: דף אחרון ו-10 דקות זיהוי מושגים. לא חומר חדש.</span></li></ul>`;
  const n=days; let groups=[];
  if(n>=PLAN.length){groups=PLAN.map(p=>[p]);for(let k=PLAN.length;k<n;k++)groups.splice(groups.length-2,0,[["תרגול מעורב","אימון היום ושאלות אירוע מהנושא החלש ("+U(weakest()[0][0]).title+")."]])}
  else{const per=Math.ceil(PLAN.length/n);for(let i=0;i<PLAN.length;i+=per)groups.push(PLAN.slice(i,i+per))}

  return `<p class="muted small" style="margin:8px 0 0">${n} ימים עד המבחן. כל יום מתחיל ב״אימון היום״ (20 דקות), ואז המשימה:</p><ul class="plan">${groups.map((g,i)=>`<li class="${i===0?"today":""}"><span class="d">${f(i)}</span><span>${g.map(p=>`<b>${esc(p[0])}</b>: ${esc(p[1])}`).join("<br>")}</span></li>`).join("")}<li><span class="d">${f(n)}</span><span><b>מבחן.</b> בבוקר: דף אחרון בלבד.</span></li></ul>`;
}

/* generic runner */
function runner(host,steps,label,onEnd){
  let i=0,score=0;
  const draw=()=>{
    if(i>=steps.length){onEnd(score,steps.length);return}
    host.innerHTML=`<div class="topline"><span>${esc(label(steps[i]))}</span><div class="bar"><i style="width:${Math.round(100*i/steps.length)}%"></i></div><span>${i+1}/${steps.length}</span></div><div id="slot"></div>`;
    steps[i].run(host.querySelector("#slot"),ok=>{if(ok)score++;i++;draw();host.scrollIntoView({block:"start",behavior:"smooth"})});
  };draw();
}

function afterEvents(){
  const draw=()=>{const L=EVENTS.filter(e=>EVF==="all"||(EVF==="src"?e.src:e.unit===EVF));
    document.getElementById("el").innerHTML=L.map(e=>`<article class="q" data-u="${e.unit}" id="${e.id}"><div class="qh"><h3>${esc(e.title)}</h3><span class="chip">${e.src?"מדפי התרגול · ":""}${esc(U(e.unit).title)}</span></div><div class="passage">${esc(e.text)}</div>${e.subs.map((s,i)=>`<div class="sq"><div class="qq">${esc(s.q)}</div><button class="lnk" data-r="${e.id}-${i}">הצג תשובה</button><div class="ans" id="a-${e.id}-${i}">${ansDL(s.a)}<div class="checklist">${["ציינתי נכון","הצגתי את כל הרכיבים","ציטטתי את המשפט המוכיח","כתבתי ״כלומר״ וקישרתי"].map(c=>`<label><input type="checkbox" data-e="${e.id}">${c}</label>`).join("")}</div></div></div>`).join("")}</article>`).join("");
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const on=document.getElementById("a-"+b.dataset.r).classList.toggle("show");b.textContent=on?"הסתר תשובה":"הצג תשובה"});
    document.querySelectorAll("input[data-e]").forEach(c=>c.onchange=()=>{const id=c.dataset.e,n=document.querySelectorAll(`input[data-e="${id}"]:checked`).length;if(n)S.ev[id]=n;else delete S.ev[id];save()})};
  document.querySelectorAll("#ef button").forEach(b=>b.onclick=()=>{EVF=b.dataset.f;document.querySelectorAll("#ef button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});draw();
}

/* ---------- KNOWLEDGE ---------- */
function vKnow(){return hero(null,"שלב 5 · להיבחן","שאלות ידע","ענה בעל-פה או בכתב, ואז השווה. בשאלת ידע הניקוד הולך על שלמות: כל רכיב, כל צד של ההשוואה, כל דוגמה שנדרשה.")+
  KNOW.map(k=>`<article class="q" data-u="${k.unit}"><div class="qh"><h3 style="font-size:17.5px">${esc(k.q)}</h3><span class="chip">${k.src?"מדפי התרגול · ":""}${esc(U(k.unit).title)}</span></div><div class="row"><button class="lnk" data-k="${k.id}">הצג תשובה</button><label class="small muted" style="display:inline-flex;gap:8px;align-items:center"><input type="checkbox" data-kd="${k.id}" ${S.kn[k.id]?"checked":""} style="accent-color:var(--accent)">עניתי מלא</label></div><div class="ans" id="k-${k.id}"><div class="model" style="margin-top:8px">${k.a}</div></div></article>`).join("")+pager("knowledge")}
function afterKnow(){document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const on=document.getElementById("k-"+b.dataset.k).classList.toggle("show");b.textContent=on?"הסתר תשובה":"הצג תשובה"});document.querySelectorAll("[data-kd]").forEach(c=>c.onchange=()=>{if(c.checked)S.kn[c.dataset.kd]=1;else delete S.kn[c.dataset.kd];save()})}

/* ---------- SIM ---------- */
let simT=null,simLeft=0;const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function vSim(){return hero(null,"שלב 5 · להיבחן","סימולציית מבחן","שלוש שאלות אירוע ושתי שאלות ידע מנושאים שונים, עם עדיפות לשאלות שלא ראית. 45 דקות. התשובות נפתחות רק בהגשה.")+
  `<div class="card simbar"><div><div class="timer" id="tm">45:00</div><span class="muted small">כ-9 דקות לשאלה</span></div><div class="row"><button class="btn main" id="sS">מבחן חדש</button><button class="btn" id="sE" disabled>הגשה</button></div></div><div id="sl"></div>`+pager("sim")}
function afterSim(){
  document.getElementById("sS").onclick=()=>{const by=a=>shuffle(a).sort((x,y)=>(S.seen[x.id]||0)-(S.seen[y.id]||0));const used=new Set(),ev=[],kn=[];
    for(const e of by(EVENTS))if(ev.length<3&&!used.has(e.unit)){ev.push(e);used.add(e.unit)}
    for(const k of by(KNOW))if(kn.length<2&&!used.has(k.unit)){kn.push(k);used.add(k.unit)}
    while(kn.length<2)kn.push(by(KNOW).find(x=>!kn.includes(x)));[...ev,...kn].forEach(x=>S.seen[x.id]=(S.seen[x.id]||0)+1);save();let n=0;
    document.getElementById("sl").innerHTML=ev.map(e=>`<article class="q" data-u="${e.unit}"><div class="qh"><h3>שאלה ${++n}</h3><span class="chip">אירוע</span></div><div class="passage">${esc(e.text)}</div>${e.subs.map(s=>`<div class="sq"><div class="qq">${esc(s.q)}</div><textarea aria-label="תשובה" placeholder="ציין · הצג · בקטע כתוב: ״...״ · כלומר..."></textarea><div class="ans" data-sa>${ansDL(s.a)}</div></div>`).join("")}</article>`).join("")+
      kn.map(k=>`<article class="q" data-u="${k.unit}"><div class="qh"><h3>שאלה ${++n}</h3><span class="chip">ידע</span></div><div class="qq">${esc(k.q)}</div><textarea aria-label="תשובה"></textarea><div class="ans" data-sa><div class="model" style="margin-top:8px">${k.a}</div></div></article>`).join("");
    simLeft=2700;document.getElementById("tm").textContent=fmt(simLeft);document.getElementById("sE").disabled=false;clearInterval(simT);
    simT=setInterval(()=>{simLeft--;const t=document.getElementById("tm");if(!t){clearInterval(simT);return}t.textContent=fmt(Math.max(0,simLeft));if(simLeft<=0)endSim()},1000)};
  document.getElementById("sE").onclick=endSim;
}
function endSim(){clearInterval(simT);document.querySelectorAll("[data-sa]").forEach(x=>x.classList.add("show"));const b=document.getElementById("sE");if(b)b.disabled=true;
  document.getElementById("sl").insertAdjacentHTML("afterbegin",`<div class="card"><h3>הוגש · ${fmt(2700-Math.max(0,simLeft))}</h3><p class="muted" style="margin:0">בדוק כל תשובה בארבעה סעיפים: מושג, כל הרכיבים, ציטוט, ״כלומר״. כל סעיף חסר הוא נקודות שהבודק יוריד.</p></div>`)}

/* ---------- LAST ---------- */
function vLast(){
  const b=(u,t,mn,items)=>`<section data-u="${u}"><h4>${t}</h4>${mn?`<div class="mn">${mn}</div>`:""}<ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul></section>`;
  return hero(null,"בוקר המבחן","דף אחרון","רק מה שצריך להיות בראש כשנכנסים.")+`<div class="cheat">`+
   b("u4","זכויות טבעיות","כ·ח·ה·ח·ש·ק",["כבוד: פרטיות, שם טוב","חירות: ביטוי, מצפון, תנועה, עיסוק, דת, מדת","הליך הוגן · חיים וביטחון","שוויון · קניין (חומרי ורוחני)"])+
   b("u2","תנאי בחירות","כ״ח מש״ה",["כלליות: מי משתתף","חשאיות: חופש מלחץ","מחזוריות: מועדים קבועים","שוויוניות: קול אחד לכל אחד","התמודדות חופשית והוגנת"])+
   b("u2","בחירות בישראל","",["ארצית · יחסית · רשימתית","אחוז חסימה 3.25% (כ-4 מנדטים)","לבחור: אזרח, מגיל 18","להיבחר: אזרח, 21+, בלי הרשעה עם קלון (7 שנים / חנינה)"])+
   b("u4","שלוש מדיניויות","",["<b>אפליה פסולה</b>: הבדל לא רלוונטי","<b>הבחנה מותרת</b>: הבדל רלוונטי, לפי צורך","<b>העדפה מתקנת</b>: קבוצה מקופחת · זמן מסוים · צמצום פערים"])+
   b("u4","זכויות פוליטיות","",["<b>לכל אדם</b>: הפגנה ומחאה, חופש המידע, ביקורת","<b>לאזרח</b>: לבחור, להיבחר, להקים מפלגה"])+
   b("u3","הכרעת הרוב","",["הרוב מכריע","אבל אסור לפגוע באופן לא סביר בזכויות יסוד ובמיעוט","שימוש לרעה = עריצות הרוב"])+
   b("u1","שני מבחנים","",["<b>פורמלית</b>: איך הוחלט (כללי משחק)","<b>מהותית</b>: מה הוחלט (זכויות, ערכים)","הובס: ביטחון · לוק: זכויות"])+
   b("u5","שתי גישות","",["<b>ליברלית</b>: חירות, שוק, הפרטה, מסים נמוכים","<b>סוציאל-דמוקרטית</b>: שוויון, רשת ביטחון, מס על עשירים"])+
   b("u6","זכויות קבוצה","",["שפה · חינוך · תרבות · דת · ייצוג","ערבים: ערבית, חינוך, בתי דין, פטור מגיוס","יהודים: חינוך חרדי וממ״ד, גיוס, שבת"])+
  `</div><div class="card" style="margin-top:14px"><h3>נוסחת התשובה</h3><p style="margin:0">ציין ← הצג (כל הרכיבים) ← ״בקטע כתוב...״ ← ״כלומר...״</p></div><p class="muted small" style="margin-top:20px">נבנה מרשימת החומר, המצגות, דפי התרגול ומחוון מושגי היסוד של הפיקוח על הוראת האזרחות. ״מושג רקע״ במחוון אינו נדרש כהגדרת חובה. ההתקדמות נשמרת רק בדפדפן הזה.</p>`+pager("last");
}

/* ---------- ROUTER ---------- */
const VIEWS={home:[vHome,afterHome],today:[vToday,afterToday],cards:[vCards,afterCards],drill:[vDrill,afterDrill],quote:[vQuote,afterQuote],grade:[vGrade,afterGrade],events:[vEvents,afterEvents],knowledge:[vKnow,afterKnow],sim:[vSim,afterSim],last:[vLast,null]};
function route(){
  let id=(location.hash||"#home").slice(1);if(!ROUTES.find(r=>r.id===id))id="home";CUR=id;clearInterval(simT);paintNav();
  const v=document.getElementById("view");
  if(VIEWS[id]){v.innerHTML=VIEWS[id][0]();if(VIEWS[id][1])VIEWS[id][1]()}else{v.innerHTML=vUnit(id);afterUnit(id)}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);route();
</script>
</body>
</html>
